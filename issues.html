<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* 手机排错：脚本出错时在页面底部显示原因（ES5，旧浏览器也能跑） */(function(){function show(m){try{var d=document.getElementById('jsErr');if(!d){d=document.createElement('div');d.id='jsErr';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b91c1c;color:#fff;font:12px/1.4 -apple-system,sans-serif;padding:8px 10px;word-break:break-all';(document.body||document.documentElement).appendChild(d);}d.textContent='页面出错，请截图发给管理员：'+m+' | '+navigator.userAgent;}catch(e){}}window.addEventListener('error',function(e){var t=e.target||{};if(String(e.filename||'').indexOf('/supabase.js')>-1)return;show(t.src?('资源加载失败 '+t.src):((e.message||'error')+(e.filename?' @'+String(e.filename).split('/').pop()+':'+e.lineno:'')));},true);window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('Promise: '+(r&&r.message||r));});})();</script>
<title>异常待办 · 运配跟进</title>
<script src="config.js" onerror="void 0"></script>
<script src="supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>')</script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e7e8ec;--line2:#f0f1f4;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--red:#E1251B;--good:#1f8a4c;--warn:#b26b00;--blue:#2a5bd7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:22px 24px 60px}
.nav{display:flex;gap:4px;margin-bottom:16px;background:#e9ebef;border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow:auto}
.nav a{padding:7px 16px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600;white-space:nowrap}
.nav a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0f172a1a}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:28px;margin:0;line-height:1.2}
h1 small{font-size:14px;color:var(--ink3);font-weight:500;margin-left:8px}
.sub{color:var(--ink2);margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.green{background:var(--good);color:#fff;border-color:var(--good)}
.btn.amber{background:#d98a00;color:#fff;border-color:#d98a00}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.filters{padding:12px 16px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{margin-left:4px}
select,input[type=text],input[type=datetime-local],textarea{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff}
textarea{width:100%;min-height:64px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px 16px}.stat small{color:var(--ink2);font-size:12px}.stat b{display:block;font-size:24px}
.issue{padding:14px 16px;margin-bottom:10px;border-left:4px solid #e3e5ea}
.issue.todo{border-left-color:var(--red)}.issue.doing{border-left-color:#d98a00}.issue.done{border-left-color:var(--good)}
.ih{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.it{font-weight:700;font-size:16px}.im{color:var(--ink2);font-size:13px;margin-top:2px}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.todo{background:#fdeceb;color:var(--red)}.st.doing{background:#fff1d6;color:#8a5600}.st.done{background:#e5f5ec;color:var(--good)}
.exc{display:inline-block;background:#f1f3f6;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin-right:6px}
.note{margin:8px 0;font-size:14px}
.res{background:#f2faf5;border:1px solid #cfe9da;border-radius:9px;padding:8px 10px;font-size:13px;margin:8px 0}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.acts label{font-size:12px;color:var(--ink2)}
.log{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;color:var(--ink2)}
.log div{margin:3px 0}.log time{color:var(--ink3);margin-right:6px;font-variant-numeric:tabular-nums}.log b{color:var(--ink)}
.ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.modal{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}.modal label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.modal select,.modal input{width:100%}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.login{max-width:380px;margin:80px auto;padding:28px}
.login input{width:100%;margin-top:8px;padding:10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172ae6;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}
</style>
</head>
<body>
<div id="loginView" class="card login" style="display:none;text-align:center">
  <nav class="nav" style="margin:0 auto 14px;font-size:13px"><a href="index.html">提货看板</a><a href="daily.html">日均预测</a><a href="scan.html">揽收妥投达成</a><a href="issues.html" class="on">异常待办</a></nav>
  <div style="font-size:36px;line-height:1">🔒</div>
  <h2 style="margin:10px 0 4px">请登录</h2><div class="sub">「异常待办」仅运配组和已授权账号可用</div>
  <form id="loginForm"><input id="email" type="email" placeholder="邮箱" required><input id="pwd" type="password" placeholder="密码" required>
  <div id="loginErr" class="err"></div>
  <button class="btn dark" style="width:100%;padding:10px" type="submit">登录</button></form>
</div>

<div id="app" class="wrap" style="display:none">
  <nav class="nav"><a href="index.html">提货看板</a><a href="daily.html">日均预测</a><a href="scan.html">揽收妥投达成</a><a href="issues.html" class="on">异常待办</a></nav>
  <header class="top">
    <div><h1>异常待办<small id="me"></small></h1><div class="sub">填报页 / 管理员 / 有账号的人报备的异常，自动按服务商指派；跟进中可记进展，已解决需填写解决方式。大看板只显示状态和负责人。</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn red" id="btnNew">＋ 报备异常</button><button class="btn" id="btnReload">刷新</button><button class="btn" id="btnLogout">退出</button></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="card filters">
    <div class="chips" id="fStatus"></div>
    <select id="fWho"></select>
    <select id="fDays"><option value="3">近 3 天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option><option value="120">全部</option></select>
    <input type="text" id="fQ" placeholder="搜索 仓库 / 服务商 / Trailer / 备注" style="flex:1;min-width:180px">
  </div>
  <div id="list"></div>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const CFG=window.APP_CONFIG||{}; const LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
const sb=LIVE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EXCS=['晚到','车满/部分拒收','货未齐','车辆问题','其他'];
const STL={todo:'待跟进',doing:'跟进中',done:'已解决'};
const S={issues:[],logs:{},members:[],wh:{},carriers:[],me:'',f:{status:'open',who:'all',days:7,q:''}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}
const whName=c=>{const w=S.wh[c];return w?(w.alias||w.name||c):c;};
const tzOf=c=>(S.wh[c]&&S.wh[c].tz)||'America/Los_Angeles';
function tLocal(ts,wh){ if(!ts) return ''; return new Intl.DateTimeFormat('zh-CN',{timeZone:tzOf(wh),month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts)); }
function tPT(ts){ return new Intl.DateTimeFormat('zh-CN',{timeZone:'America/Los_Angeles',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts)); }
const carrierLabel=p=>p.sub_carrier?`FedEx ${p.sub_carrier}`:p.carrier;
const isAdminRow=p=>p.kind==='admin'||/^ADMIN-/.test(p.trailer_no||'');

async function load(){
  const since=new Date(Date.now()-S.f.days*864e5).toISOString();
  const [iq,mq,wq,cq]=await Promise.all([
    sb.from('issues').select('*, p:pickups(id,date,warehouse,carrier,sub_carrier,trailer_no,arrived_at,exception_type,note,reporter,photo_paths,kind,voided,dock)').gte('created_at',since).order('created_at',{ascending:false}).limit(1000),
    sb.from('ops_members').select('*').eq('active',true).order('sort'),
    S.wh.__loaded?{data:null}:sb.from('warehouses').select('*'),
    S.carriers.length?{data:null}:sb.from('carriers').select('code').eq('active',true)
  ]);
  if(iq.error) throw iq.error;
  S.issues=(iq.data||[]).filter(x=>x.p&&!x.p.voided);
  S.members=mq.data||[];
  if(wq.data){ wq.data.forEach(w=>S.wh[w.code]=w); S.wh.__loaded=true; }
  if(cq.data) S.carriers=cq.data.map(x=>x.code);
  const ids=S.issues.map(x=>x.id); const LG={};   // 先拼好再一次性替换，避免两次刷新同时进行时日志重复
  for(let i=0;i<ids.length;i+=200){ const lq=await sb.from('issue_logs').select('*').in('issue_id',ids.slice(i,i+200)).order('at'); (lq.data||[]).forEach(l=>(LG[l.issue_id]=LG[l.issue_id]||[]).push(l)); }
  S.logs=LG;
}
function filtered(){
  const q=S.f.q.trim().toLowerCase();
  return S.issues.filter(x=>{
    if(S.f.status==='open'&&x.status==='done') return false;
    if(['todo','doing','done'].includes(S.f.status)&&x.status!==S.f.status) return false;
    if(S.f.who==='me'&&x.assignee!==S.me) return false;
    if(S.f.who==='none'&&x.assignee) return false;
    if(!['all','me','none'].includes(S.f.who)&&x.assignee!==S.f.who) return false;
    if(q&&![x.p.warehouse,whName(x.p.warehouse),carrierLabel(x.p),x.p.trailer_no,x.p.note,x.p.exception_type,x.assignee,x.resolution,x.p.reporter].join(' ').toLowerCase().includes(q)) return false;
    return true; });
}
function render(){
  const all=S.issues, c=k=>all.filter(x=>x.status===k).length, mine=all.filter(x=>x.assignee===S.me&&x.status!=='done').length;
  $('stats').innerHTML=[['待跟进',c('todo'),'var(--red)'],['跟进中',c('doing'),'#b26b00'],['已解决',c('done'),'var(--good)'],['我的未解决',mine,'var(--ink)']].map(([l,n,col])=>`<div class="card stat"><small>${l}</small><b style="color:${col}">${n}</b></div>`).join('');
  const SF=[['open','未解决'],['todo','待跟进'],['doing','跟进中'],['done','已解决'],['all','全部']];
  $('fStatus').innerHTML=SF.map(([k,l])=>`<span class="chip ${S.f.status===k?'on':''}" data-fs="${k}">${l}</span>`).join('');
  $('fWho').innerHTML=`<option value="all">全部负责人</option><option value="me">我的（${esc(S.me)}）</option><option value="none">未指派</option>`+S.members.map(m=>`<option value="${esc(m.name)}">${esc(m.name)} · ${esc(m.full_name||'')}</option>`).join('');
  $('fWho').value=S.f.who;
  const rows=filtered();
  $('list').innerHTML=rows.length?rows.map(card).join(''):`<div class="card empty">没有符合条件的异常</div>`;
}
function card(x){
  const p=x.p, logs=S.logs[x.id]||[];
  const opts=`<option value="">未指派</option>`+S.members.map(m=>`<option value="${esc(m.name)}" ${x.assignee===m.name?'selected':''}>${esc(m.name)}</option>`).join('');
  const head=`${esc(whName(p.warehouse))} · ${esc(carrierLabel(p))}${isAdminRow(p)?' · <span style="color:var(--ink3)">报备</span>':` · ${esc(p.trailer_no)}`}`;
  const acts = x.status==='done'
    ? `<button class="btn sm" data-act="reopen" data-id="${x.id}">重新打开</button>`
    : `${x.status==='todo'?`<button class="btn sm amber" data-act="start" data-id="${x.id}">跟进中</button>`:''}<button class="btn sm" data-act="note" data-id="${x.id}">记进展</button><button class="btn sm green" data-act="resolve" data-id="${x.id}">已解决</button>`;
  return `<div class="card issue ${x.status}">
    <div class="ih"><div><div class="it">${head}</div><div class="im">${tLocal(p.arrived_at,p.warehouse)}（当地）${p.dock?` · Dock ${esc(p.dock)}`:''} · 报备人 ${esc(p.reporter||'—')}</div></div>
      <div style="text-align:right"><span class="st ${x.status}">${STL[x.status]}${x.assignee?` @${esc(x.assignee)}`:''}</span></div></div>
    <div class="note"><span class="exc">${esc(p.exception_type)}</span>${esc(p.note||'')}</div>
    ${x.status==='done'&&x.resolution?`<div class="res"><b>解决方式：</b>${esc(x.resolution)}${x.resolved_by?` <span style="color:var(--ink3)">— ${esc(x.resolved_by)} ${x.resolved_at?tPT(x.resolved_at):''}</span>`:''}</div>`:''}
    ${(p.photo_paths||[]).length?`<div class="ph" data-ph="${x.id}"><button class="btn sm" data-showph="${x.id}">查看照片（${p.photo_paths.length}）</button></div>`:''}
    <div class="acts"><label>负责人</label><select data-assign="${x.id}">${opts}</select>${acts}</div>
    ${logs.length?`<div class="log">${logs.map(l=>`<div><time>${tPT(l.at)}</time><b>${esc(l.actor||'')}</b> ${({created:'创建',assign:'指派',start:'开始跟进',note:'进展',resolve:'已解决',reopen:'重新打开'})[l.action]||esc(l.action)}${l.note?`：${esc(l.note)}`:''}</div>`).join('')}</div>`:''}
  </div>`;
}
async function act(id,action,note,assignee){
  const r=await sb.rpc('issue_act',{p_id:id,p_action:action,p_note:note||null,p_assignee:assignee===undefined?null:assignee});
  if(r.error||r.data!=='ok'){ toast('操作失败：'+(r.error?r.error.message:({no_permission:'没有权限',need_resolution:'请填写解决方式',empty:'内容为空'})[r.data]||r.data)); return false; }
  await load(); render(); return true;
}
function modal(html){ $('mbox').innerHTML=html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
function textModal(title,ph,required,btn,cls,onOk){
  modal(`<h3>${title}</h3><textarea id="mText" placeholder="${esc(ph)}"></textarea><div class="err" id="mErr"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" id="mCancel">取消</button><button class="btn ${cls}" id="mOk">${btn}</button></div>`);
  $('mText').focus(); $('mCancel').onclick=closeModal;
  $('mOk').onclick=async()=>{ const v=$('mText').value.trim(); if(required&&!v){ $('mErr').textContent='这一项必填'; return; } $('mOk').disabled=true; if(await onOk(v)) closeModal(); else $('mOk').disabled=false; };
}
document.addEventListener('click',async e=>{
  const fs=e.target.closest('[data-fs]'); if(fs){ S.f.status=fs.dataset.fs; render(); return; }
  const b=e.target.closest('[data-act]'); if(b){ const id=b.dataset.id, a=b.dataset.act;
    if(a==='start') return textModal('开始跟进','可选：先写一句跟进计划，比如「已联系 UniUni 调度」',false,'跟进中','amber',v=>act(id,'start',v));
    if(a==='note') return textModal('记录进展','比如：问了 UniUni，答复今晚加车',true,'保存','dark',v=>act(id,'note',v));
    if(a==='resolve') return textModal('已解决 · 填写解决方式','必填：怎么解决的，比如「UniUni 20:00 加 1 车，剩余货已提走」',true,'确认已解决','green',v=>act(id,'resolve',v));
    if(a==='reopen') return textModal('重新打开','可选：为什么重新打开',false,'重新打开','amber',v=>act(id,'reopen',v));
  }
  const sp=e.target.closest('[data-showph]'); if(sp){ const x=S.issues.find(i=>i.id===sp.dataset.showph); const box=sp.parentElement; box.innerHTML='加载中…';
    const urls=await Promise.all((x.p.photo_paths||[]).map(async path=>{ const {data}=await sb.storage.from('pickup-photos').createSignedUrl(path,3600); return data&&data.signedUrl; }));
    box.innerHTML=urls.filter(Boolean).map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt=""></a>`).join('')||'<span style="color:var(--ink3);font-size:12px">照片已归档到 JoySpace</span>'; return; }
});
document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-assign]'); if(s){ s.disabled=true; await act(s.dataset.assign,'assign',null,s.value||null); return; }
});
$('fWho').onchange=e=>{S.f.who=e.target.value; render();};
$('fDays').onchange=async e=>{S.f.days=+e.target.value; await load(); render();};
$('fQ').oninput=e=>{S.f.q=e.target.value; render();};
$('btnReload').onclick=async()=>{ await load(); render(); toast('已刷新'); };
$('btnNew').onclick=()=>{
  const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  const whs=Object.values(S.wh).filter(w=>w&&w.code).sort((a,b)=>a.code.localeCompare(b.code));
  modal(`<h3>报备异常</h3><div style="font-size:12px;color:var(--ink2)">不算到车，只生成异常任务（按服务商自动指派）</div>
    <label>仓库</label><select id="nWh">${whs.map(w=>`<option value="${esc(w.code)}">${esc(w.code)} · ${esc(w.alias||w.name||'')}</option>`).join('')}</select>
    <label>服务商</label><select id="nC">${S.carriers.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <label>时间</label><input type="datetime-local" id="nAt" value="${now}">
    <label>异常类型</label><select id="nType">${EXCS.map(x=>`<option>${x}</option>`).join('')}</select>
    <label>Trailer（选填）</label><input type="text" id="nTr" placeholder="不知道可以不填">
    <label>备注（必填）</label><textarea id="nNote" placeholder="比如：UniUni 来早了，货还没做完就提走了"></textarea>
    <div class="err" id="nErr"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" id="nCancel">取消</button><button class="btn red" id="nOk">提交</button></div>`);
  $('nCancel').onclick=closeModal;
  $('nOk').onclick=async()=>{ const note=$('nNote').value.trim(); if(!note){ $('nErr').textContent='请填写备注'; return; }
    $('nOk').disabled=true;
    const r=await sb.rpc('issue_report',{p_wh:$('nWh').value,p_carrier:$('nC').value,p_at:new Date($('nAt').value).toISOString(),p_type:$('nType').value,p_note:note,p_trailer:$('nTr').value.trim()||null});
    if(r.error){ $('nErr').textContent='提交失败：'+r.error.message; $('nOk').disabled=false; return; }
    closeModal(); toast('已报备，已生成异常任务'); await load(); render(); };
};
async function start(){
  if(!LIVE){ $('loginView').style.display='block'; $('loginErr').textContent='未配置数据库'; return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('loginView').style.display='block'; $('app').style.display='none'; return; }
  const ok=await sb.rpc('can_ops');
  if(!ok.data){ $('loginView').style.display='block'; $('app').style.display='none'; $('loginErr').textContent='当前账号还没有权限，请联系管理员在「揽收妥投达成」的「权限」里添加你的邮箱。'; await sb.auth.signOut(); return; }
  const me=await sb.rpc('ops_actor'); S.me=me.data||''; $('me').textContent=S.me?`我：${S.me}`:'';
  $('loginView').style.display='none'; $('app').style.display='block';
  try{ await load(); }catch(e){ $('list').innerHTML=`<div class="card empty">加载失败：${esc(e.message||e)}</div>`; return; }
  render();
  sb.channel('iss').on('postgres_changes',{event:'*',schema:'public',table:'issues'},async()=>{ try{ await load(); render(); }catch(e){} }).subscribe();
}
$('loginForm').onsubmit=async e=>{e.preventDefault(); const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pwd').value}); if(error){$('loginErr').textContent='登录失败：'+error.message;return;} start();};
$('btnLogout').onclick=async()=>{await sb.auth.signOut(); location.reload();};
start();
</script>
