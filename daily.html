<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日均预测 · 今日出库预测 · 2026 Black Friday</title>
<script src="config.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e7e8ec;--line2:#f0f1f4;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--blue:#E1251B;--blue-soft:#fdeceb;--red:#E1251B;--fc:#d5d9e0;--good:#0ca30c;--good-ink:#0a7a0a;--good-bg:#e9f7e9;--warn-bg:#fdf4e1;--bad:#d03b3b;--bad-bg:#fbeaea;--muted-bg:#f1f3f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:22px 28px 60px}
.nav{display:flex;gap:4px;margin-bottom:16px;background:#e9ebef;border-radius:12px;padding:4px;width:max-content;max-width:100%}
.nav a{padding:7px 16px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0f172a1a}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:30px;line-height:1.2;margin:0}
.sub{color:var(--ink2);margin-top:6px;font-size:15px}
.chip-status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)} .dot.live{background:var(--good)} .dot.demo{background:#c98500}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;text-decoration:none;color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.filters{padding:14px 18px;display:flex;gap:14px 18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.filters label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:200px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 30px 20px;color:#fff;background:linear-gradient(120deg,#E1251B 0%,#C81623 60%,#A50F17 100%);margin-bottom:18px;box-shadow:0 8px 24px #e1251b26}
.hero .lbl{opacity:.92;font-size:15px}
.hero .big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.hero .big b{font-size:60px;line-height:1;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hero .big span{font-size:16px;opacity:.92}
.hero .grid{clear:both;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;border-top:1px solid #ffffff38;padding-top:14px}
.hero .grid small{display:block;opacity:.85;font-size:13px}
.hero .grid b{font-size:22px;font-variant-numeric:tabular-nums}
.hero .tag{position:absolute;top:18px;right:20px;background:#ffffff26;border:1px solid #ffffff55;padding:4px 10px;border-radius:999px;font-size:12px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.alert{padding:10px 14px;border-radius:12px;font-size:13px;background:var(--warn-bg);color:#6b4a00}
.alert.bad{background:var(--bad-bg);color:#8a1f1f} .alert.info{background:#eef2f7;color:var(--ink2)}
.panel{padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:16px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hint{color:var(--ink3);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>*,.filters>*{min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--ink2);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:#fafbfc}
th.grp{text-align:center;border-left:1px solid var(--line);background:#f4f6f9}
td.bl,th.bl{border-left:1px solid var(--line)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--muted-bg);color:var(--ink2)}
.tag.good{background:var(--good-bg);color:var(--good-ink)} .tag.warn{background:var(--warn-bg);color:#946200} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.err{font-variant-numeric:tabular-nums;font-weight:600}
.chart{position:relative} .chart svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:#0f172a;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;z-index:5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.banner{padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:#6b4a00;margin-bottom:16px;font-size:13px}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:13px}
.login{max-width:380px;margin:12vh auto;padding:28px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.foot{color:var(--ink3);font-size:12px;margin-top:10px;line-height:1.7}
.wh-link{color:var(--red);cursor:pointer;font-weight:600}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.hero .grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.wrap{padding:16px 14px 40px}h1{font-size:24px}.hero{padding:20px}.hero .big b{font-size:44px}.hero .grid{grid-template-columns:repeat(2,1fr)}.hero .tag{position:static;display:inline-block;margin-bottom:8px}.filters select{min-width:0;width:100%}.filters>div{flex:1 1 140px}}

/* ===== 京东红 · 简约主题 ===== */
.hero .tag{color:#fff!important;background:#ffffff26!important;border:1px solid #ffffff55!important}
body{background:#f5f5f6}
.wrap{max-width:1320px}
h1{font-size:26px;font-weight:700}
h1::before{content:"";display:inline-block;width:6px;height:24px;background:var(--red);border-radius:3px;margin-right:10px;vertical-align:-3px}
.sub{font-size:14px;color:#6b7280}
.card{border:0;box-shadow:0 1px 2px #0000000d,0 1px 8px #0000000a;border-radius:14px}
.panel{padding:18px 20px}
.panel h2{font-size:15px;font-weight:700}
.nav{background:transparent;padding:0;gap:22px;border-bottom:1px solid #e5e7eb;width:100%;border-radius:0;margin-bottom:20px}
.nav a{padding:10px 2px;border-radius:0;font-size:15px;color:#6b7280}
.nav a.on{background:none;box-shadow:none;color:var(--red);border-bottom:3px solid var(--red);margin-bottom:-1px}
.chip{border-color:#e5e7eb;color:#4b5563}

.btn{border-color:#e5e7eb}
.btn.primary{background:var(--red);border-color:var(--red)}
.chip-status{border-color:#e5e7eb}
.kpi .v{font-size:28px}
.kpi small{color:#6b7280}
th{background:#fafafa;color:#6b7280}
.tbl-wrap{border-color:#eeeeef}
.filters{gap:12px 20px}
.legend i{border-radius:2px}
.banner{background:#fff6f5;color:#8a1c14;border:1px solid #fbd5d1}
.hero .grid{border-top-color:#ffffff40}
.demo-tag{background:#ffffff26!important}

/* ===== 顶部卡片：红白配色 ===== */
.hero{background:#fff!important;color:var(--ink)!important;box-shadow:0 1px 2px #0000000d,0 1px 8px #0000000a!important;border-top:4px solid var(--red);border-radius:14px!important}
.hero .lbl{color:#4b5563;opacity:1}
.hero .big b{color:var(--red)}
.hero .big span{color:#6b7280;opacity:1}
.hero .grid{border-top:1px solid #f0f0f1!important}
.hero .grid small{color:#6b7280;opacity:1}
.hero .grid b{color:var(--ink)}
.hero .joy{float:right;height:104px;margin:-8px 4px -14px 16px;pointer-events:none}
.hero .demo-tag,.hero .tag{position:static!important;display:inline-block;margin:0 0 0 8px;background:#f3f4f6!important;border:1px solid #e5e7eb!important;color:#6b7280!important;font-size:11.5px;padding:1px 8px;border-radius:999px;vertical-align:1px}
h1 .joy-ic{height:34px;vertical-align:-7px;margin-right:8px}
h1::before{display:none!important}
</style>
</head>

function addDays(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);}
function errTag(est, need){ if(!need||est==null) return '<span class="hint">—</span>'; const e=(est-need)/need*100; const cls=Math.abs(e)<=5?'good':Math.abs(e)<=15?'warn':'bad'; return `<span class="tag ${cls}">${e>0?'+':''}${e.toFixed(1)}%</span>`; }
function rateTag(done, need){ if(!need) return '<span class="hint">—</span>'; const r=done/need*100; const cls=r>=98?'good':r>=90?'warn':'bad'; return `<span class="tag ${cls}">${r.toFixed(1)}%</span>`; }

// ---------- 演示数据：基于 LAX2 推送样例（11/09）按仓缩放，仅用于预览 ----------
function demoData(){
  const base=[['京东尾程','FedEx Ground',2959,2920,8,44,3,'53ft'],['京东尾程','GOFO',2611,884,11,1,1,'Live Load'],['京东尾程','DHL',2525,996,10,4,1,'53ft'],['京东尾程','USPS',1839,526,7,1,1,'53ft'],['京东尾程','UPS',681,393,2,6,1,'53ft'],['京东尾程','SpeedX',212,107,2,0,1,'车'],['京东尾程','UniUni',196,50,1,0,1,'Live Load'],['京东尾程','FedEx Air',19,10,1,0,1,'Live Load'],['客户自约','TikTok CBT',2659,0,9,0,null,null],['客户自约','USPS',399,0,2,0,null,null],['客户自约','GOFO STANDARD',233,0,1,0,null,null],['客户自约','SwiftX 0024(Temu)',28,0,1,0,null,null],['客户自约','SwiftX 普通',25,0,1,0,null,null]];
  const scale={'ONT-SM-2-US':1,'LAX-LG-1-US':.55,'ONT-LG-4-US':.25,'ONT-LG-5-US':.35,'EWR-LG-1-US':.5,'EWR-SM-2-US':.8,'EWR-SM-3-US':.45,'EWR-LG-5-US':.12,'ATL-SM-2-US':.7,'HOU-SM-1-US':.4};
  let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const runs=[],lines={},actual=[]; const today=todayPT(); const days=[];
  for(let i=13;i>=0;i--){const d=addDays(today,-i); const k=new Date(d+'T12:00:00').getDay(); if(k!==0&&k!==6) days.push(d);}
  for(const [wh,sc] of Object.entries(scale)){
    const w=whOf(wh), east=(w.tz||'').includes('New_York')||(w.tz||'').includes('Chicago');
    for(const d of days){
      const day=1+(rnd()-.5)*.3;
      for(const rt of (d===today?['morning']:['morning','evening'])){
        const id=`${wh}-${d}-${rt}`; const ls=[]; let T={a:0,e:0,g:0,p:0,v:0};
        for(const [cat,c,n,ft3,g,p,v,l] of base){ if(sc<.3 && cat==='客户自约' && rnd()<.5) continue;
          const est=Math.max(1,Math.round(n*sc*day*(0.9+rnd()*.2))); const arr=rt==='morning'?Math.round(est*(0.45+rnd()*.25)):est;
          const gg=Math.max(1,Math.round(g*sc*day)), pp=Math.round(p*sc*day), vv=v==null?null:Math.max(v,Math.ceil((gg+pp)/(l==='53ft'?24:12)-0.05));
          ls.push({cat,carrier:c,arrived:arr,est,ratio:arr/est,gaylord:gg,pallets:pp,ft3:Math.round(ft3*sc*day),trucks:vv,truck_label:l});
          T.a+=arr;T.e+=est;T.g+=gg;T.p+=pp;T.v+=vv||0;
          if(rt==='morning' && d!==today){ const need=Math.round(est*(1+(rnd()-.5)*.08)); const done=Math.round(need*(0.95+rnd()*.05));
            actual.push({warehouse:wh,date:d,cat,carrier:c,due:need,pre_done:0,done,late:need-done,packed:done,final:true}); }
        }
        lines[id]=ls;
        runs.push({id,warehouse:wh,date:d,run_type:rt,run_at: rt==='morning'?`${d}T${east?'14':'17'}:00:00Z`:`${addDays(d,1)}T02:00:00Z`,local_time:rt==='morning'?'09:00':(east?'21:00':'18:00'),status:'ok',
          total_arrived:T.a,total_est:T.e,gaylord:T.g,pallets:T.p,trucks:T.v,done_before:0,backlog:rnd()<.3?Math.round(rnd()*60):0,backlog_detail:{},other_carriers:{},demo:true});
      }
    }
  }
  return {runs,lines,actual};
}

// ---------- 数据 ----------
async function loadLive(){
  const from=addDays(todayPT(),-30);
  const [w,r,a]=await Promise.all([
    sb.from('warehouses').select('code,name,alias,region,tz,wms_code,forecast_enabled').order('code'),
    sb.from('daily_forecast_runs').select('*').gte('date',from).order('run_at',{ascending:false}).limit(3000),
    sb.from('daily_actual').select('*').gte('date',from).limit(20000),
  ]);
  for(const x of [w,r,a]) if(x.error) throw x.error;
  if(w.data.length) S.warehouses=w.data.filter(x=>!EXCLUDED.has(x.code));
  S.runs=r.data; S.actual=a.data; S.lines={};
  try{
    const [f,p]=await Promise.all([sb.from('forecast').select('date,warehouse,carrier,fc_units,fc_orders').limit(5000), sb.from('pickups').select('date,warehouse,carrier,orders,pallets,voided').gte('date',from).limit(20000)]);
    if(!f.error&&f.data.length) S.peak=f.data; if(!p.error) S.pickups=p.data.filter(x=>!x.voided);
  }catch(e){}
}
async function linesFor(runIds){
  const need=runIds.filter(id=>!S.lines[id]); if(!need.length||!LIVE) return;
  const {data,error}=await sb.from('daily_forecast').select('*').in('run_id',need).limit(10000);
  if(error) throw error; need.forEach(id=>S.lines[id]=[]); data.forEach(l=>S.lines[l.run_id].push(l));
}
function runsOf(wh,date){ return S.runs.filter(r=>r.warehouse===wh&&r.date===date).sort((a,b)=>b.run_at.localeCompare(a.run_at)); }
function pickRun(wh,date){ const rs=runsOf(wh,date).filter(r=>r.status==='ok'); if(S.f.run==='morning') return rs.find(r=>r.run_type==='morning'); if(S.f.run==='evening') return rs.find(r=>r.run_type==='evening'); return rs[0]; }
function morningRun(wh,date){ return runsOf(wh,date).filter(r=>r.status==='ok'&&r.run_type==='morning').slice(-1)[0] || runsOf(wh,date).filter(r=>r.status==='ok').slice(-1)[0]; } // 当天第一次早上运行
function actualOf(wh,date){ return S.actual.filter(a=>a.warehouse===wh&&a.date===date); }
function localTime(r){ const w=whOf(r.warehouse); try{ return new Intl.DateTimeFormat('zh-CN',{timeZone:w.tz||'America/Los_Angeles',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(r.run_at)); }catch(e){ return r.local_time||''; } }

function carrierTable(cat,icon,L,mMap,aMap,need,jd){
  const rows=L.filter(l=>l.cat===cat).sort((a,b)=>b.est-a.est);
  if(!rows.length) return '';
  const T={a:0,e:0,me:0,g:0,p:0,v:0,ft3:0,need:0,done:0,late:0,has:false};
  const tr=rows.map(l=>{ const k=cat+'|'+l.carrier, a=aMap[k], m=mMap[k]; const n=need(a);
    T.a+=l.arrived;T.e+=l.est;T.me+=(m?m.est:l.est);T.g+=l.gaylord||0;T.p+=l.pallets||0;T.v+=l.trucks||0;T.ft3+=+l.ft3||0; if(a){T.has=true;T.need+=n;T.done+=a.done-a.pre_done;T.late+=a.late;}
    return `<tr><td><b>${esc(l.carrier)}</b></td><td class="num"><b>${fmt(l.est)}</b></td><td class="num">${fmt(l.arrived)}</td>${jd?`<td class="num">${l.ratio!=null?Math.round(l.ratio*100)+'%':'—'}</td><td class="num">${fmt(l.ft3)}</td>`:''}<td class="num">G${fmt(l.gaylord)}${l.pallets?` / 托${fmt(l.pallets)}`:''}</td>${jd?`<td class="num">${l.trucks?`${esc(l.truck_label)}×${l.trucks}`:'—'}</td>`:''}
      <td class="num bl">${a?fmt(n):'—'}</td><td class="num">${a?fmt(a.done-a.pre_done):'—'}</td><td class="num">${a?(a.late?`<span style="color:var(--bad)">${fmt(a.late)}</span>`:'0'):'—'}</td><td class="num">${a?rateTag(a.done-a.pre_done,n):'—'}</td><td class="num">${a?errTag(m?m.est:l.est,n):'—'}</td></tr>`; }).join('');
  return `<section class="card panel"><div class="ph"><h2>${icon} ${cat}：预估 ${fmt(T.e)} 单（已到 ${fmt(T.a)}）</h2><span class="hint">${jd?'预派车 = max(保底车数, 托位 ÷ 每车托位)':'客户自约车辆由承运商安排，不给派车建议'}</span></div>
   <div class="tbl-wrap"><table><thead><tr><th colspan="${jd?7:4}">早上 / 本次预测</th><th class="grp" colspan="5">实际做货（iWMS）</th></tr>
   <tr><th>服务商</th><th class="num">预估单量</th><th class="num">已到</th>${jd?'<th class="num">到单比例</th><th class="num">方数 ft³</th>':''}<th class="num">Gaylord / 托盘</th>${jd?'<th class="num">预派车</th>':''}<th class="num bl">实际需做</th><th class="num">按时完成</th><th class="num">未按时</th><th class="num">完成率</th><th class="num">早上预测误差</th></tr></thead>
   <tbody>${tr}<tr class="total"><td>合计</td><td class="num">${fmt(T.e)}</td><td class="num">${fmt(T.a)}</td>${jd?`<td></td><td class="num">${fmt(T.ft3)}</td>`:''}<td class="num">G${fmt(T.g)}${T.p?` / 托${fmt(T.p)}`:''}</td>${jd?`<td class="num">${fmt(T.v)}</td>`:''}<td class="num bl">${T.has?fmt(T.need):'—'}</td><td class="num">${T.has?fmt(T.done):'—'}</td><td class="num">${T.has?fmt(T.late):'—'}</td><td class="num">${T.has?rateTag(T.done,T.need):'—'}</td><td class="num">${T.has?errTag(T.me,T.need):'—'}</td></tr></tbody></table></div></section>`;

function peakCompare(w,d,ML){
  const jd=ML.filter(l=>l.cat==='京东尾程');
  const by={}; PEAK_ORDER.forEach(c=>by[c]={est:0,trucks:0,has:false});
  jd.forEach(l=>{const p=PEAK[l.carrier]; if(!p) return; by[p].est+=l.est; by[p].trucks+=l.trucks||0; by[p].has=true;});
  const unit=c=>['GOFO','UNIUNI','Speedx'].includes(c)?'板':'车';
  const rows=PEAK_ORDER.map(c=>{ const pf=S.peak.filter(r=>r.warehouse===w.code&&r.date===d&&r.carrier===c); const pk=S.pickups.filter(r=>r.warehouse===w.code&&r.date===d&&r.carrier===c);
    if(!by[c].has&&!pf.length&&!pk.length) return '';
    const fo=pf.reduce((s,r)=>s+(r.fc_orders||0),0), fu=pf.reduce((s,r)=>s+(r.fc_units||0),0);
    return `<tr><td><b>${c}</b>${c==='FedEx'?'<div class="hint">Ground + Air</div>':''}</td><td class="num">${by[c].has?fmt(by[c].est):'—'}</td><td class="num">${pf.length&&pf.some(r=>r.fc_orders!=null)?fmt(fo):'—'}</td><td class="num">${by[c].has&&fo?errTag(by[c].est,fo).replace('tag ','tag '):'—'}</td><td class="num bl">${by[c].has?fmt(by[c].trucks):'—'}</td><td class="num">${pf.length?fmt(fu)+' '+unit(c):'—'}</td><td class="num">${pk.length?fmt(pk.length)+' 车':(d<=todayPT()&&pf.length?'<span class="hint">未填报</span>':'—')}</td></tr>`; }).join('');
  return `<div class="ph"><h2>对照大促预测与实际到车 · ${md(d)}</h2></div>
  <div class="tbl-wrap"><table><thead><tr><th>服务商</th><th class="num">今早预估单量</th><th class="num">大促预测单量</th><th class="num">偏差</th><th class="num bl">预派车</th><th class="num">大促预测车/板</th><th class="num">实际到车</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">暂无</td></tr>'}</tbody></table></div>
  <div class="hint" style="margin-top:6px">大促预测只覆盖 11/20–12/4；实际到车来自仓库填报小程序。偏差 = 今早预估 ÷ 大促预测 − 1。</div>`;
}

function accuracyChart(wh){
  const el=$('accChart'); const days=[...new Set(S.runs.filter(r=>r.warehouse===wh).map(r=>r.date))].sort().slice(-14);
  const ser=days.map(d=>{const m=morningRun(wh,d); const a=actualOf(wh,d); return {date:d,fc:m?m.total_est:0,ac:a.length?a.reduce((s,x)=>s+x.due-x.pre_done,0):null};});
  if(!ser.length){ el.innerHTML='<div class="empty">暂无历史</div>'; return; }
  const W=Math.max(300,el.clientWidth||520),H=230,P={l:46,r:8,t:12,b:30},iw=W-P.l-P.r,ih=H-P.t-P.b,step=iw/ser.length,bw=Math.min(26,step*.6);
  const max=Math.max(1,...ser.map(s=>Math.max(s.fc,s.ac||0))); const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;}; const top=nice(max), y=v=>P.t+ih-(v/top)*ih;
  const rb=(x,yy,w,h,r)=>h<=0?'':(r=Math.min(r,h),`M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+w-r}Q${x+w},${yy} ${x+w},${yy+r}V${yy+h}Z`);
  let g=''; for(let i=0;i<=4;i++){const v=top*i/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#eef0f3"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#94a3b8">${v>=1000?(v/1000)+'k':v}</text>`;}
  const every=step>=36?1:2;
  ser.forEach((s,i)=>{const cx=P.l+step*i+step/2; if(s.fc) g+=`<path d="${rb(cx-bw/2,y(s.fc),bw,P.t+ih-y(s.fc),4)}" fill="var(--fc)"/>`; if(s.ac){const w2=bw*.56; g+=`<path d="${rb(cx-w2/2,y(s.ac),w2,P.t+ih-y(s.ac),3)}" fill="var(--blue)" stroke="#fff" stroke-width="2" paint-order="stroke"/>`;}
    if(i%every===0||i===ser.length-1) g+=`<text x="${cx}" y="${H-P.b+16}" text-anchor="middle" font-size="11" fill="#64748b">${md(s.date)}</text>`; g+=`<rect class="hit" data-i="${i}" x="${cx-step/2}" y="${P.t}" width="${step}" height="${ih}" fill="transparent"/>`;});
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${P.t+ih}" y2="${P.t+ih}" stroke="#cbd2db"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg><div class="tip"></div>`;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(h=>{h.onmousemove=e=>{const s=ser[+h.dataset.i],rc=el.getBoundingClientRect();tip.innerHTML=`<b>${md(s.date)} 周${wd(s.date)}</b><br>早上预测：${fmt(s.fc)} 单<br>实际需做：${s.ac==null?'待复核':fmt(s.ac)+' 单'}${s.ac?`<br>误差：${((s.fc-s.ac)/s.ac*100).toFixed(1)}%`:''}`;tip.style.left=(e.clientX-rc.left)+'px';tip.style.top=(e.clientY-rc.top-10)+'px';tip.style.opacity=1;}; h.onmouseleave=()=>tip.style.opacity=0;});
  const ok=ser.filter(s=>s.ac&&s.fc); const mape=ok.length?ok.reduce((t,s)=>t+Math.abs(s.fc-s.ac)/s.ac,0)/ok.length*100:null;
  $('accHint').textContent = mape==null?'实际需做由傍晚复核和次日早上复核写入':`近 ${ok.length} 个工作日平均绝对误差 ${mape.toFixed(1)}%（早上预测 vs 实际需做）`;
}

async function renderAll(){
  const d=S.f.date; const ws=S.warehouses;
  const runs=ws.map(w=>({w,run:pickRun(w.code,d),mrun:morningRun(w.code,d),err:runsOf(w.code,d).find(r=>r.status==='error'),act:actualOf(w.code,d)}));
  await linesFor(runs.filter(x=>x.run).map(x=>x.run.id));
  const T={e:0,a:0,g:0,p:0,v:0,bl:0,need:0,done:0,me:0,has:0};
  const rows=runs.map(({w,run,mrun,err,act})=>{
    if(!run){ const st=PENDING[w.code]?`<span class="tag">${PENDING[w.code]}</span>`:err?`<span class="tag bad">失败</span> <span class="hint">${esc(String(err.error).slice(0,40))}</span>`:'<span class="tag">未运行</span>';
      return `<tr><td><span class="wh-link" data-wh="${w.code}">${esc(w.code)}</span><div class="hint">${esc(w.wms_code||'')} · ${esc(w.name)}</div></td><td>${st}</td><td colspan="9"></td></tr>`; }
    const need=act.reduce((s,a)=>s+a.due-a.pre_done,0), done=act.reduce((s,a)=>s+a.done-a.pre_done,0);
    T.e+=run.total_est;T.a+=run.total_arrived;T.g+=run.gaylord;T.p+=run.pallets;T.v+=run.trucks;T.bl+=run.backlog||0; if(act.length){T.need+=need;T.done+=done;T.me+=mrun?mrun.total_est:run.total_est;T.has++;}
    return `<tr><td><span class="wh-link" data-wh="${w.code}">${esc(w.code)}</span><div class="hint">${esc(w.wms_code||'')} · ${esc(w.name)}</div></td><td>${run.run_type==='evening'?'傍晚':'早上'} ${localTime(run)}${err&&err.run_at>run.run_at?' <span class="tag bad">最近失败</span>':''}</td>
      <td class="num"><b>${fmt(run.total_est)}</b></td><td class="num">${fmt(run.total_arrived)}</td><td class="num">${fmt(run.gaylord)}</td><td class="num">${fmt(run.pallets)}</td><td class="num">${fmt(run.trucks)}</td><td class="num">${run.backlog?`<span style="color:var(--bad)">${fmt(run.backlog)}</span>`:'0'}</td>
      <td class="num bl">${act.length?fmt(need):'—'}</td><td class="num">${act.length?rateTag(done,need):'—'}</td><td class="num">${act.length?errTag(mrun?mrun.total_est:run.total_est,need):'—'}</td></tr>`;}).join('');
  // 全美按服务商
  const byC={}; runs.forEach(({run})=>{ if(!run) return; (S.lines[run.id]||[]).forEach(l=>{ const k=l.cat+'|'+l.carrier; const o=byC[k]=byC[k]||{cat:l.cat,carrier:l.carrier,est:0,arr:0,g:0,p:0,v:0,n:0}; o.est+=l.est;o.arr+=l.arrived;o.g+=l.gaylord||0;o.p+=l.pallets||0;o.v+=l.trucks||0;o.n++; }); });
  const cRows=Object.values(byC).sort((a,b)=>(a.cat>b.cat?1:a.cat<b.cat?-1:0)||b.est-a.est).map(o=>`<tr><td>${o.cat==='京东尾程'?'🚚':'🤝'} <b>${esc(o.carrier)}</b></td><td class="num"><b>${fmt(o.est)}</b></td><td class="num">${fmt(o.arr)}</td><td class="num">G${fmt(o.g)}${o.p?` / 托${fmt(o.p)}`:''}</td><td class="num">${o.cat==='京东尾程'?fmt(o.v):'—'}</td><td class="num">${o.n}</td></tr>`).join('');
  const live=runs.filter(x=>x.run).length;
  $('view').innerHTML=`
  <section class="hero"><img class="joy" src="${JOY}" alt="">
    <div class="lbl">${S.runs.some(r=>r.demo)?'<span class="tag" style="margin:0 8px 0 0">演示数据</span>':''}全美自营仓 · ${md(d)} 周${wd(d)} 今日出库预测（${live} / ${ws.filter(w=>!PENDING[w.code]).length} 个仓已出结果）</div>
    <div class="big"><b>${fmt(T.e)}</b><span>今日预报单量（已到 ${fmt(T.a)}）</span></div>
    <div class="grid"><div><small>Gaylord</small><b>${fmt(T.g)}</b></div><div><small>托盘</small><b>${fmt(T.p)}</b></div><div><small>预派车提货</small><b>${fmt(T.v)}</b></div><div><small>积压单量</small><b>${fmt(T.bl)}</b></div><div><small>早上预测误差</small><b>${T.has?((T.me-T.need)/T.need*100).toFixed(1)+'%':'—'}</b></div></div>
  </section>
  <section class="card panel"><div class="ph"><h2>各仓今日预测</h2><span class="hint">点仓库编码查看服务商明细</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>仓库</th><th>最近运行（当地）</th><th class="num">预估单量</th><th class="num">已到</th><th class="num">Gaylord</th><th class="num">托盘</th><th class="num">预派车</th><th class="num">积压</th><th class="num bl">实际需做</th><th class="num">完成率</th><th class="num">早上预测误差</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>合计</td><td></td><td class="num">${fmt(T.e)}</td><td class="num">${fmt(T.a)}</td><td class="num">${fmt(T.g)}</td><td class="num">${fmt(T.p)}</td><td class="num">${fmt(T.v)}</td><td class="num">${fmt(T.bl)}</td><td class="num bl">${T.has?fmt(T.need):'—'}</td><td class="num">${T.has?rateTag(T.done,T.need):'—'}</td><td class="num">${T.has?errTag(T.me,T.need):'—'}</td></tr></tbody></table></div></section>
  <section class="card panel"><div class="ph"><h2>全美按服务商</h2></div>
    <div class="tbl-wrap"><table><thead><tr><th>服务商</th><th class="num">预估单量</th><th class="num">已到</th><th class="num">Gaylord / 托盘</th><th class="num">预派车</th><th class="num">覆盖仓数</th></tr></thead><tbody>${cRows||'<tr><td colspan="6" class="empty">暂无</td></tr>'}</tbody></table></div></section>`;
}

function renderBanner(){
  $('banner').innerHTML = LIVE ? '' : `<div class="banner"><b>演示模式</b>：尚未连接数据库，以下为按 LAX2 推送样例生成的<b>演示数据</b>（非真实）。部署并运行采集脚本后，这里显示各仓每天早上的真实预测。</div>`;
  $('modeDot').className='dot '+(LIVE?'live':'demo'); $('modeText').textContent=LIVE?'实时 · 已连接数据库':'演示数据';
  $('foot').innerHTML=`口径与 LAX2 每日推送一致（复用 lax2_daily_push.py 的函数）：按系统截单时间=当天统计；剔除 2B 与取消/拉回/拦截/转病单；今天之前已打包的单不计入；全天预估 = 已到单 ÷ 历史同时点到单比例（各仓当地时间，15:00 后不放大）。实际需做 = 截单当天应做 − 截单日前已提前做完；按时完成 = 截单当天及之前打包。傍晚复核为当天临时值，次日早上运行覆盖为最终值。EWR-SM-4-US 不做日均预测。`;
}
async function render(){ renderFilters(); try{ await renderView(); }catch(e){ $('view').innerHTML=`<div class="alert bad">加载失败：${esc(e.message||e)}</div>`; } }
$('fWh').onchange=e=>{S.f.wh=e.target.value; render();};
$('fDate').onchange=e=>{S.f.date=e.target.value; render();};
$('fRun').onchange=e=>{S.f.run=e.target.value; render();};
document.addEventListener('click',e=>{const a=e.target.closest('[data-wh]'); if(a){S.f.wh=a.dataset.wh; render(); window.scrollTo(0,0);}});
$('btnRefresh').onclick=async()=>{ if(LIVE){ try{ await loadLive(); }catch(e){} } render(); };
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{ if(S.f.wh!=='ALL') accuracyChart(S.f.wh); },150);});

async function start(){
  renderBanner();
  if(!LIVE){ Object.assign(S, demoData()); $('app').style.display='block'; return render(); }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('loginView').style.display='block'; return; }
  $('app').style.display='block'; $('btnLogout').style.display='';
  try{ await loadLive(); }catch(e){ $('banner').innerHTML=`<div class="banner">加载失败：${esc(e.message)}</div>`; }
  render();
  sb.channel('dfr').on('postgres_changes',{event:'INSERT',schema:'public',table:'daily_forecast_runs'},async()=>{ try{ await loadLive(); render(); }catch(e){} }).subscribe();
}
$('loginForm').onsubmit=async e=>{e.preventDefault(); const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pwd').value}); if(error){$('loginErr').textContent='登录失败：'+error.message;return;} $('loginView').style.display='none'; start();};
$('btnLogout').onclick=async()=>{await sb.auth.signOut(); location.reload();};
start();
</script>
