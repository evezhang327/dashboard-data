<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#E1251B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>提货车辆登记 · Pickup Check-in</title>
<script src="config.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--red:#E1251B;--bg:#f5f5f6;--card:#fff;--line:#e3e5ea;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--blue:#2a78d6;--good:#0a7a0a;--good-bg:#e9f7e9;--bad:#c62f2f;--bad-bg:#fbeaea;--warn-bg:#fdf4e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#E1251B,#C81623);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:18px;margin:0;line-height:1.25}
.top small{display:block;opacity:.7;font-size:12px;font-weight:400}
.lang{display:flex;border:1px solid #ffffff44;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 10px;font-size:13px;opacity:.6}
.lang button.on{background:#fff;color:#C81623;opacity:1}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:0;box-shadow:0 1px 2px #0000000d,0 1px 8px #0000000a;border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.lbl .req{color:var(--bad);margin-left:2px}
.lbl small{font-weight:400;color:var(--ink3);font-size:12px}
select,input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e1251b40;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;text-align:center;font-weight:600;font-size:15px;cursor:pointer}
.opt small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.opt.on{border-color:var(--red);background:var(--red);color:#fff}
.opt.on small{color:#ffd9d6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trailer{text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:20px!important}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f1f3f6}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:#0f172acc;color:#fff;font-size:14px;line-height:24px;padding:0}
.add{width:84px;height:84px;border:1.5px dashed #b8bfca;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;cursor:pointer;background:#fff}
.add b{font-size:26px;line-height:1;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;background:#fff;cursor:pointer}
.chip.on{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.chip.none.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.submit{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.submit button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:17px;font-weight:700}
.submit button:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.note{font-size:13px;color:var(--ink2);background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.today{font-size:13px;color:var(--ink2)}
.today .t{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.today .t:last-child{border:0}
.today b{color:var(--ink)}
.done{text-align:center;padding:30px 16px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);font-size:34px;line-height:64px;margin:0 auto 10px}
.done h2{margin:0 0 6px}
.done .sum{text-align:left;background:#f8f9fb;border-radius:10px;padding:10px 12px;margin:14px 0;font-size:14px}
.btn2{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;margin-top:8px}
.btn2.dark{background:var(--red);color:#fff;border-color:var(--red)}
.tabs{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 14px 0;display:flex;justify-content:center}
.tabs div{display:flex;background:#e6e8ec;border-radius:12px;padding:3px;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--red);box-shadow:0 1px 2px #0f172a1a}
.hrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hrow select,.hrow input{flex:1;padding:10px;font-size:15px}
.ro{font-size:12px;color:var(--ink2);background:#eef2f7;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.hsum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:4px 0 10px}
.hsum b{color:var(--ink);font-size:16px}
.rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.rec .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .tr{font-weight:700;font-size:17px;letter-spacing:.5px}
.rec .m{font-size:13px;color:var(--ink2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--ink2)}
.pill.c{background:#fdeceb;color:#C81623}
.pill.x{background:var(--bad-bg);color:var(--bad)}
.rec.void{opacity:.55}
.rec.void .tr{text-decoration:line-through}
.hchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.hchips .chip{white-space:nowrap;font-size:13px;padding:5px 11px}
.hchips .chip.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:600}
.overlay.on{display:flex}
</style>
</head>

const sb = LIVE ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:false}}) : null;

      fail:'提交失败，请检查网络后重试：',tabForm:'登记',tabHistory:'历史记录',readonly:'只读：可查看本仓已提交的记录，不能修改。备注：若错误提交需要修改，请联系运配管理员。',fixNote:'备注：若错误提交需要修改，请联系运配管理员。',refresh:'刷新',hToday:'今天',hYesterday:'昨天',hAll:'大促全部（11/20–12/4）',hAllCarrier:'全部',hSearch:'搜索 Trailer / 填报人',hTrucks:'车',hOrders:'单',hPallets:'板',hNone:'没有记录',hVoid:'已作废',hPhotos:'张照片',hBy:'填报',hLoading:'加载中…',hErr:'查询失败：',hPickWh:'请先在「登记」页选择仓库',todayTitle:'今日本仓已登记',trucks:'车',none:'今天还没有登记',unitT:'按车',unitP:'按板',confirmDup:'今天这个 Trailer 已登记过，确定再次提交吗？再点一次提交确认。'},
  en:{title:'Pickup Check-in',wh:'Warehouse',carrier:'Carrier',trailer:'Trailer Number',trailerHint:'As shown on the trailer',arrived:'Arrival time',now:'Now',orders:'Orders handed over',pallets:'Pallets',photos:'Photos',photoHint:'Trailer no. / loading, up to 6',addPhoto:'Camera',exception:'Exception',notePh:'Describe the issue (optional)',reporter:'Your name',submit:'Submit',
      demo:'Demo mode: not connected to the database. Submissions are not saved.',
      excs:[['','None'],['晚到','Late'],['车满/部分拒收','Full / partial refusal'],['货未齐','Freight not ready'],['车辆问题','Vehicle issue'],['其他','Other']],
      e_wh:'Select a warehouse',e_carrier:'Select a carrier',e_trailer:'Enter the trailer number',e_arrived:'Enter the arrival time',e_orders:'Orders cannot be negative',e_pallets:'Pallets cannot be negative',optional:'optional',e_photo:'Take at least 1 photo',e_reporter:'Enter your name',e_note:'Please describe "Other"',
      uploading:'Uploading photos…',saving:'Submitting…',okTitle:'Checked in',again:'Check in another truck',dup:'This truck was already submitted (same warehouse, carrier, trailer and time).',
      fail:'Submit failed. Check your connection and retry: ',tabForm:'Check-in',tabHistory:'History',readonly:'Read-only: view this warehouse\'s submitted records. Note: if a record was submitted by mistake, contact the transport & distribution admin to correct it.',fixNote:'Note: if this was submitted by mistake, contact the transport & distribution admin to correct it.',refresh:'Refresh',hToday:'Today',hYesterday:'Yesterday',hAll:'Whole peak (11/20–12/4)',hAllCarrier:'All',hSearch:'Search trailer / name',hTrucks:'trucks',hOrders:'orders',hPallets:'pallets',hNone:'No records',hVoid:'Voided',hPhotos:'photos',hBy:'by',hLoading:'Loading…',hErr:'Query failed: ',hPickWh:'Select a warehouse on the Check-in tab first',todayTitle:'Checked in today at this warehouse',trucks:'trucks',none:'Nothing checked in yet today',unitT:'truck',unitP:'pallet',confirmDup:'This trailer was already checked in today. Tap Submit again to confirm.'},

const store = { get(k,d){ try{ const v=localStorage.getItem('pk_'+k); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('pk_'+k,v); }catch(e){} } };
const params = new URLSearchParams(location.search);
let lang = params.get('lang') || store.get('lang', (navigator.language||'').startsWith('zh')?'zh':'en');
const S = { warehouses: BOOT.warehouses, carriers: BOOT.carriers, carrier:'', exc:'', photos:[], today:null, dupConfirm:false, tab:'form', hCarrier:'', hRows:[], demoRows:[] };
const $ = id=>document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = k => T[lang][k];

function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t(el.dataset.t); });
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  $('note').placeholder=t('notePh'); $('hQ').placeholder=t('hSearch'); if(S.tab==='history'){ renderHDate(); renderHistory(); }
  renderCarriers(); renderExc(); renderPhotos(); renderWhTitle(); renderToday();
}
function whObj(){ return S.warehouses.find(w=>w.code===$('wh').value); }
function renderWhTitle(){ const w=whObj(); $('whTitle').textContent = w ? `${w.code} · ${w.name}` : 'Peak 2026'; }
function renderWh(){
  const pre = params.get('wh') || store.get('wh','');
  $('wh').innerHTML = `<option value="">—</option>` + S.warehouses.map(w=>`<option value="${esc(w.code)}">${esc(w.code)} · ${esc(w.name)}</option>`).join('');
  if(S.warehouses.some(w=>w.code===pre)) $('wh').value=pre;
}
function renderCarriers(){
  $('carriers').innerHTML = S.carriers.map(c=>`<div class="opt ${S.carrier===c.code?'on':''}" data-carrier="${esc(c.code)}">${esc(c.code)}<small>${c.unit==='pallet'?t('unitP'):t('unitT')}</small></div>`).join('');
  const unit=(S.carriers.find(c=>c.code===S.carrier)||{}).unit;
  $('palletReq').style.display = unit==='pallet' ? '' : 'none';
}
function renderExc(){
  $('exc').innerHTML = t('excs').map(([v,l])=>`<span class="chip ${v===''?'none':''} ${S.exc===v?'on':''}" data-exc="${esc(v)}">${esc(l)}</span>`).join('');
  $('note').style.display = S.exc ? '' : 'none';
}
function renderPhotos(){
  $('photos').innerHTML = S.photos.map((p,i)=>`<div class="ph"><img src="${p.url}" alt=""><button data-del="${i}" aria-label="remove">×</button></div>`).join('') +
    (S.photos.length<6 ? `<div class="add" id="addPhoto"><b>＋</b>${t('addPhoto')}</div>` : '');
}
function localInputValue(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function localDateIn(tz, d){ return new Intl.DateTimeFormat('en-CA',{timeZone:tz||'America/Los_Angeles'}).format(d); }

async function renderToday(){
  const w=whObj(); const box=$('todayBox');
  if(!w || !LIVE){ box.style.display='none'; return; }
  const day=localDateIn(w.tz, new Date());
  const { data, error } = await sb.rpc('wh_today',{p_wh:w.code,p_date:day});
  if(error){ box.style.display='none'; return; }
  S.today={day,rows:data||[]};
  box.style.display='';
  box.innerHTML = `<div class="lbl"><span>${t('todayTitle')}</span><small>${day}</small></div>` +
    (data&&data.length ? data.map(r=>`<div class="t"><span><b>${esc(r.carrier)}</b> · ${r.trucks} ${t('trucks')}</span><span style="text-align:right;max-width:60%;word-break:break-all">${(r.trailers||[]).map(esc).join(', ')}</span></div>`).join('') : `<div>${t('none')}</div>`);
}

// 照片压缩：长边 1600px，JPEG 0.75
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1600; let {width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error('compress')); },'image/jpeg',0.75); };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2));
const clientId = store.get('cid','') || (()=>{ const v=uuid(); store.set('cid',v); return v; })();

function validate(){
  const w=whObj(); const unit=(S.carriers.find(c=>c.code===S.carrier)||{}).unit;
  if(!w) return 'e_wh'; if(!S.carrier) return 'e_carrier';
  if(!$('trailer').value.trim()) return 'e_trailer'; if(!$('arrived').value) return 'e_arrived';
  if($('orders').value!=='' && +$('orders').value<0) return 'e_orders';
  if($('pallets').value!=='' && +$('pallets').value<0) return 'e_pallets';
  if(!S.photos.length) return 'e_photo'; if(S.exc==='其他' && !$('note').value.trim()) return 'e_note';
  if(!$('reporter').value.trim()) return 'e_reporter';
  return null;
}
function overlay(txt){ $('overlay').classList.toggle('on',!!txt); $('overlayText').textContent=txt||''; }

async function submit(){
  $('err').textContent='';
  const v=validate(); if(v){ $('err').textContent=t(v); $('err').scrollIntoView({block:'center',behavior:'smooth'}); return; }
  const w=whObj(); const trailer=$('trailer').value.trim().toUpperCase().replace(/\s+/g,'');
  // 同日同 trailer 已登记：二次确认
  if(S.today && !S.dupConfirm){ const hit=(S.today.rows||[]).find(r=>r.carrier===S.carrier&&(r.trailers||[]).some(x=>x.toUpperCase()===trailer)); if(hit){ S.dupConfirm=true; $('err').textContent=t('confirmDup'); return; } }
  const arrived=new Date($('arrived').value);
  const day=localDateIn(w.tz, arrived);
  const row={ date:day, warehouse:w.code, carrier:S.carrier, trailer_no:trailer, arrived_at:arrived.toISOString(),
    orders: $('orders').value===''?null:+$('orders').value, pallets: $('pallets').value===''?null:+$('pallets').value,
    exception_type: S.exc||null, note: S.exc ? ($('note').value.trim()||null) : null,
    reporter: $('reporter').value.trim(), photo_paths:[], client_id: clientId };
  store.set('wh',w.code); store.set('reporter',row.reporter);
  $('submit').disabled=true;
  try{
    if(LIVE){
      overlay(t('uploading'));
      for(const p of S.photos){
        const path=`${w.code}/${day}/${S.carrier}_${trailer}_${uuid().slice(0,8)}.jpg`;
        const { error } = await sb.storage.from('pickup-photos').upload(path, p.blob, {contentType:'image/jpeg', upsert:false});
        if(error) throw error; row.photo_paths.push(path);
      }
      overlay(t('saving'));
      const { error } = await sb.from('pickups').insert(row);
      if(error){ if(error.code==='23505') throw new Error(t('dup')); throw error; }
    } else { await new Promise(r=>setTimeout(r,500)); S.demoRows.unshift({...row, id:uuid(), photo_count:S.photos.length, voided:false, created_at:new Date().toISOString()}); }
    overlay(''); showDone(row, w);
  }catch(err){ overlay(''); $('err').textContent = t('fail') + (err.message||err); }
  finally{ $('submit').disabled=false; }
}
function showDone(row, w){
  $('formView').style.display='none'; $('submitBar').style.display='none';
  const d=new Date(row.arrived_at);
  $('doneView').style.display='';
  $('doneView').innerHTML = `<div class="card done"><div class="ok">✓</div><h2>${t('okTitle')}</h2>${LIVE?'':`<div class="note">${t('demo')}</div>`}
    <div class="sum"><div><b>${esc(w.code)}</b> · ${esc(row.carrier)}</div><div>Trailer: <b>${esc(row.trailer_no)}</b></div><div>${t('arrived')}: ${d.toLocaleString(lang==='zh'?'zh-CN':'en-US',{hour12:false})}</div><div>${t('orders')}: ${row.orders??'—'}${row.pallets!=null?` · ${t('pallets')}: ${row.pallets}`:''}</div>${row.exception_type?`<div style="color:var(--bad)">${t('exception')}: ${esc(row.exception_type)}</div>`:''}<div>${t('photos')}: ${S.photos.length}</div></div>
    <div class="note" style="margin-top:10px;text-align:left">${t('fixNote')}</div><button class="btn2 dark" id="againBtn">${t('again')}</button></div>`;
  $('againBtn').onclick=resetForm;
}
function resetForm(){
  S.photos.forEach(p=>URL.revokeObjectURL(p.url)); S.photos=[]; S.exc=''; S.dupConfirm=false;
  $('trailer').value=''; $('orders').value=''; $('pallets').value=''; $('note').value=''; $('arrived').value=localInputValue(new Date());
  $('doneView').style.display='none'; $('formView').style.display=''; $('submitBar').style.display='';
  renderExc(); renderPhotos(); renderToday(); window.scrollTo(0,0);
}

document.addEventListener('click', e=>{
  const c=e.target.closest('[data-carrier]'); if(c){ S.carrier=c.dataset.carrier; S.dupConfirm=false; renderCarriers(); return; }
  const x=e.target.closest('[data-exc]'); if(x){ S.exc=x.dataset.exc; renderExc(); return; }
  const d=e.target.closest('[data-del]'); if(d){ const i=+d.dataset.del; URL.revokeObjectURL(S.photos[i].url); S.photos.splice(i,1); renderPhotos(); return; }
  if(e.target.closest('#addPhoto')){ $('file').click(); return; }
  const l=e.target.closest('[data-lang]'); if(l){ lang=l.dataset.lang; store.set('lang',lang); applyLang(); return; }
});
$('file').onchange=async e=>{
  const files=[...e.target.files].slice(0, 6-S.photos.length); e.target.value='';
  for(const f of files){ const blob=await compress(f); S.photos.push({blob, url:URL.createObjectURL(blob)}); }
  renderPhotos();
};
$('wh').onchange=()=>{ store.set('wh',$('wh').value); renderWhTitle(); renderToday(); };
$('trailer').oninput=()=>{ S.dupConfirm=false; };
$('nowBtn').onclick=()=>{ $('arrived').value=localInputValue(new Date()); };
$('submit').onclick=submit;

// ---------- 历史记录（只读） ----------
const PEAK=['2026-11-20','2026-12-04'];
function addDays(d,n){ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function renderHDate(){
  const w=whObj(); const today=localDateIn(w&&w.tz, new Date()); const cur=$('hDate').value;
  const opts=[[today+'|'+today,t('hToday')],[addDays(today,-1)+'|'+addDays(today,-1),t('hYesterday')],[PEAK[0]+'|'+PEAK[1],t('hAll')]];
  for(let d=PEAK[1]; d>=PEAK[0]; d=addDays(d,-1)){ if(d<=today && d!==today && d!==addDays(today,-1)) opts.push([d+'|'+d, d.slice(5).replace('-','/')]); }
  $('hDate').innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(cur && opts.some(o=>o[0]===cur)) $('hDate').value=cur;
  $('hCarrier').innerHTML=[['',t('hAllCarrier')],...S.carriers.map(c=>[c.code,c.code])].map(([v,l])=>`<span class="chip ${S.hCarrier===v?'on':''}" data-hc="${esc(v)}">${esc(l)}</span>`).join('');
}
async function loadHistory(){
  const w=whObj();
  if(!w){ S.hRows=null; return renderHistory(); }
  const [from,to]=$('hDate').value.split('|');
  if(!LIVE){ S.hRows=S.demoRows.filter(r=>r.warehouse===w.code&&r.date>=from&&r.date<=to); return renderHistory(); }
  $('hList').innerHTML=`<div class="empty" style="text-align:center;color:var(--ink3);padding:20px">${t('hLoading')}</div>`;
  const { data, error } = await sb.rpc('wh_history',{p_wh:w.code,p_from:from,p_to:to,p_carrier:null});
  if(error){ $('hList').innerHTML=`<div class="err">${t('hErr')}${esc(error.message)}</div>`; S.hRows=[]; return; }
  S.hRows=data||[]; renderHistory();
}
function renderHistory(){
  if(S.hRows===null){ $('hSum').innerHTML=''; $('hList').innerHTML=`<div class="ro">${t('hPickWh')}</div>`; return; }
  const q=$('hQ').value.trim().toLowerCase();
  const rows=S.hRows.filter(r=>(!S.hCarrier||r.carrier===S.hCarrier)&&(!q||[r.trailer_no,r.reporter].join(' ').toLowerCase().includes(q)));
  const live=rows.filter(r=>!r.voided);
  $('hSum').innerHTML=`<span><b>${live.length}</b> ${t('hTrucks')}</span><span><b>${live.reduce((s,r)=>s+(r.orders||0),0).toLocaleString()}</b> ${t('hOrders')}</span><span><b>${live.reduce((s,r)=>s+(r.pallets||0),0).toLocaleString()}</b> ${t('hPallets')}</span>`;
  const w=whObj();
  const fmtT=r=>{ const d=new Date(r.arrived_at); return new Intl.DateTimeFormat(lang==='zh'?'zh-CN':'en-US',{timeZone:(w&&w.tz)||undefined,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); };
  $('hList').innerHTML = rows.length ? rows.map(r=>`<div class="rec ${r.voided?'void':''}">
      <div class="h"><span class="tr">${esc(r.trailer_no)}</span><span><span class="pill c">${esc(r.carrier)}</span>${r.voided?` <span class="pill">${t('hVoid')}</span>`:''}</span></div>
      <div class="m"><span>${fmtT(r)}</span><span>${t('orders')} ${r.orders??'—'}</span>${r.pallets!=null?`<span>${t('pallets')} ${r.pallets}</span>`:''}<span>${r.photo_count||0} ${t('hPhotos')}</span><span>${t('hBy')} ${esc(r.reporter)}</span></div>
      ${r.exception_type?`<div class="m"><span class="pill x">${esc(r.exception_type)}</span>${r.note?`<span>${esc(r.note)}</span>`:''}</div>`:''}
    </div>`).join('') : `<div style="text-align:center;color:var(--ink3);padding:24px">${t('hNone')}</div>`;
}
function setTab(tab){
  S.tab=tab;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const isForm=tab==='form';
  $('historyView').style.display=isForm?'none':'';
  $('doneView').style.display='none';
  $('formView').style.display=isForm?'':'none';
  $('submitBar').style.display=isForm?'':'none';
  if(!isForm){ renderHDate(); loadHistory(); }
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ setTab(tb.dataset.tab); return; }
  const hc=e.target.closest('[data-hc]'); if(hc){ S.hCarrier=hc.dataset.hc; renderHDate(); renderHistory(); return; }
});
$('hDate').onchange=loadHistory;
$('hRefresh').onclick=loadHistory;
$('hQ').oninput=renderHistory;

async function boot(){
  if(params.get('from')==='dash'){ $('backDash').style.display=''; if(CFG.DASHBOARD_URL) $('backDash').href=CFG.DASHBOARD_URL; }
  if(LIVE){
    const [w,c]=await Promise.all([sb.from('warehouses').select('code,name,alias,region,tz').order('code'), sb.from('carriers').select('code,unit')]);
    if(!w.error && w.data.length) S.warehouses=w.data;
    if(!c.error && c.data.length){ const order=['USPS','UPS','FedEx','DHL','GOFO','UNIUNI','Speedx']; S.carriers=c.data.sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)); }
  } else { $('demoNote').style.display=''; }
  renderWh();
  $('arrived').value=localInputValue(new Date());
  $('reporter').value=store.get('reporter','');
  applyLang();
}
boot();
</script>
