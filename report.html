<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--red:#E1251B;--bg:#f5f5f6;--card:#fff;--line:#e3e5ea;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--blue:#2a78d6;--good:#0a7a0a;--good-bg:#e9f7e9;--bad:#c62f2f;--bad-bg:#fbeaea;--warn-bg:#fdf4e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#E1251B,#C81623);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:18px;margin:0;line-height:1.25}
.top small{display:block;opacity:.7;font-size:12px;font-weight:400}
.lang{display:flex;border:1px solid #ffffff44;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 10px;font-size:13px;opacity:.6}
.lang button.on{background:#fff;color:#C81623;opacity:1}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:0;box-shadow:0 1px 2px #0000000d,0 1px 8px #0000000a;border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.lbl .req{color:var(--bad);margin-left:2px}
.lbl small{font-weight:400;color:var(--ink3);font-size:12px}
select,input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e1251b40;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;text-align:center;font-weight:600;font-size:15px;cursor:pointer}
.opt small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.opt.on{border-color:var(--red);background:var(--red);color:#fff}
.opt.on small{color:#ffd9d6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trailer{text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:20px!important}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f1f3f6}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:#0f172acc;color:#fff;font-size:14px;line-height:24px;padding:0}
.add{width:84px;height:84px;border:1.5px dashed #b8bfca;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;cursor:pointer;background:#fff}
.add b{font-size:26px;line-height:1;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;background:#fff;cursor:pointer}
.chip.on{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.chip.none.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.submit{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.submit button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:17px;font-weight:700}
.submit button:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.note{font-size:13px;color:var(--ink2);background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.today{font-size:13px;color:var(--ink2)}
.today .t{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.today .t:last-child{border:0}
.today b{color:var(--ink)}
.done{text-align:center;padding:30px 16px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);font-size:34px;line-height:64px;margin:0 auto 10px}
.done h2{margin:0 0 6px}
.done .sum{text-align:left;background:#f8f9fb;border-radius:10px;padding:10px 12px;margin:14px 0;font-size:14px}
.btn2{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;margin-top:8px}
.btn2.dark{background:var(--red);color:#fff;border-color:var(--red)}
.tabs{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 14px 0;display:flex;justify-content:center}
.tabs div{display:flex;background:#e6e8ec;border-radius:12px;padding:3px;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--red);box-shadow:0 1px 2px #0f172a1a}
.hrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hrow select,.hrow input{flex:1;padding:10px;font-size:15px}
.adm{font-size:12px;background:#fff4e5;color:#8a4b00;border-radius:8px;padding:8px 10px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.adm a,.adm button{color:var(--red);background:none;border:0;padding:0;font-size:12px;text-decoration:underline;cursor:pointer}
.ract{display:flex;gap:8px;margin-top:8px}
.ract button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.ract button.r{color:var(--red);border-color:#f3c3c0}
.amodal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:flex-end;justify-content:center;z-index:60}
.amodal.on{display:flex}
.amodal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.amodal label{display:block;font-size:12px;color:var(--ink2);margin-top:8px}
.amodal input,.amodal select{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.amodal .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amodal .e{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ro{font-size:12px;color:var(--ink2);background:#eef2f7;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.hsum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:4px 0 10px}
.hsum b{color:var(--ink);font-size:16px}
.rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.rec .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .tr{font-weight:700;font-size:17px;letter-spacing:.5px}
.rec .m{font-size:13px;color:var(--ink2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--ink2)}
.pill.c{background:#fdeceb;color:#C81623}
.pill.x{background:var(--bad-bg);color:var(--bad)}
.rec.void{opacity:.55}
.rec.void .tr{text-decoration:line-through}
.hchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.hchips .chip{white-space:nowrap;font-size:13px;padding:5px 11px}
.hchips .chip.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:600}
.overlay.on{display:flex}
</style>
</head>

<main id="formView">
  <div class="note" id="demoNote" style="display:none" data-t="demo"></div>

  <div class="card">
    <div class="lbl"><span><span data-t="wh"></span><span class="req">*</span></span></div>
    <select id="wh"></select>
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="carrier"></span><span class="req">*</span></span></div>
    <div class="grid" id="carriers"></div>
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="trailer"></span><span class="req">*</span></span><small data-t="trailerHint"></small></div>
    <input type="text" id="trailer" class="trailer" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="e.g. 53A1234">
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="arrived"></span><span class="req">*</span></span><button type="button" class="chip" id="nowBtn" style="padding:3px 10px;font-size:12px" data-t="now"></button></div>
    <input type="datetime-local" id="arrived">
  </div>

  <div class="card">
    <div class="row">
      <div><div class="lbl"><span><span data-t="orders"></span><span class="req qreq">*</span></span><small class="qhint" data-t="either"></small></div><input type="number" id="orders" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      <div><div class="lbl"><span><span data-t="pallets"></span><span class="req qreq">*</span></span><small class="qhint" data-t="either"></small></div><input type="number" id="pallets" inputmode="numeric" min="0" step="1" placeholder="0"></div>
    </div>
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="photos"></span><span class="req">*</span></span><small data-t="photoHint"></small></div>
    <div class="photos" id="photos"></div>
    <input type="file" id="file" accept="image/*" capture="environment" multiple style="display:none">
  </div>

  <div class="card">
    <div class="lbl"><span data-t="exception"></span></div>
    <div class="chips" id="exc"></div>
    <textarea id="note" maxlength="500" style="margin-top:10px;display:none"></textarea>
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="reporter"></span><span class="req">*</span></span></div>
    <input type="text" id="reporter" maxlength="40" autocomplete="name">
  </div>

  <div class="card today" id="todayBox" style="display:none"></div>
  <div class="err" id="err"></div>
</main>

  <div id="hList"></div>
</main>

// 照片压缩：长边 1600px，JPEG 0.75
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1600; let {width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error('compress')); },'image/jpeg',0.75); };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}

}

async function submit(){
  $('err').textContent='';
  const v=validate(); if(v){ $('err').textContent=t(v); $('err').scrollIntoView({block:'center',behavior:'smooth'}); return; }
  const w=whObj(); const trailer=$('trailer').value.trim().toUpperCase().replace(/\s+/g,'');
  // 同日同 trailer 已登记：二次确认
  if(S.today && !S.dupConfirm){ const hit=(S.today.rows||[]).find(r=>r.carrier===S.carrier&&(r.trailers||[]).some(x=>x.toUpperCase()===trailer)); if(hit){ S.dupConfirm=true; $('err').textContent=t('confirmDup'); return; } }
  const arrived=new Date($('arrived').value);
  const day=localDateIn(w.tz, arrived);
  const row={ date:day, warehouse:w.code, carrier:S.carrier, trailer_no:trailer, arrived_at:arrived.toISOString(),
    orders: $('orders').value===''?null:+$('orders').value, pallets: $('pallets').value===''?null:+$('pallets').value,
    exception_type: S.exc||null, note: S.exc ? ($('note').value.trim()||null) : null,
    reporter: $('reporter').value.trim(), photo_paths:[], client_id: clientId };
  store.set('wh',w.code); store.set('reporter',row.reporter);
  $('submit').disabled=true;
  try{
    if(LIVE){
      overlay(t('uploading'));
      for(const p of S.photos){
        const path=`${w.code}/${day}/${S.carrier}_${trailer}_${uuid().slice(0,8)}.jpg`;
        const { error } = await sb.storage.from('pickup-photos').upload(path, p.blob, {contentType:'image/jpeg', upsert:false});
        if(error) throw error; row.photo_paths.push(path);
      }

      if(error){ if(error.code==='23505') throw new Error(t('dup')); throw error; }
    } else { await new Promise(r=>setTimeout(r,500)); S.demoRows.unshift({...row, id:uuid(), photo_count:S.photos.length, voided:false, created_at:new Date().toISOString()}); }
    overlay(''); showDone(row, w);
  }catch(err){ overlay(''); $('err').textContent = t('fail') + (err.message||err); }
  finally{ $('submit').disabled=false; }
}

function tzOffsetMs(tz, d){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime();
}
function toTzInput(iso, tz){ const d=new Date(iso); return new Date(d.getTime()+tzOffsetMs(tz,d)).toISOString().slice(0,16); }
function fromTzInput(v, tz){ const [a,b]=v.split('T'); const [y,m,dd]=a.split('-').map(Number); const [hh,mi]=b.split(':').map(Number);
  const g=Date.UTC(y,m-1,dd,hh,mi); let x=g-tzOffsetMs(tz,new Date(g)); x=g-tzOffsetMs(tz,new Date(x)); return new Date(x); }

    <div class="g2"><label>服务商<select id="eCarrier">${S.carriers.map(c=>`<option ${c.code===r.carrier?'selected':''}>${esc(c.code)}</option>`).join('')}</select></label>
    <label>Trailer<input id="eTrailer" value="${esc(r.trailer_no)}"></label></div>
    <label>到达时间<input id="eArrived" type="datetime-local" value="${toTzInput(r.arrived_at,tz)}"></label>
    <div class="g2"><label>单量<input id="eOrders" type="number" min="0" step="1" inputmode="numeric" value="${r.orders??''}"></label>
    <label>板数<input id="ePallets" type="number" min="0" step="1" inputmode="numeric" value="${r.pallets??''}"></label></div>
    <label>异常<select id="eExc">${EXC_TYPES.map(x=>`<option value="${esc(x)}" ${x===(r.exception_type||'')?'selected':''}>${x||'无异常'}</option>`).join('')}</select></label>
    <label>备注<input id="eNote" value="${esc(r.note||'')}"></label>
    <div class="e" id="eErr"></div><button class="btn2 dark" id="eSave">保存修改</button><button class="btn2" id="eCancel">取消</button>`);
  $('eCancel').onclick=amodalClose;
  $('eSave').onclick=async()=>{
    const trailer=$('eTrailer').value.trim().toUpperCase().replace(/\s+/g,'');
    const num=k=>{ const v=$(k).value; return v===''?null:Math.max(0,Math.round(+v)); };
    if(!trailer) return $('eErr').textContent='请填写 Trailer';
    if(!$('eArrived').value) return $('eErr').textContent='请填写到达时间';
    const arrived=fromTzInput($('eArrived').value,tz);
    const patch={carrier:$('eCarrier').value, trailer_no:trailer, arrived_at:arrived.toISOString(), date:localDateIn(tz,arrived),
      orders:num('eOrders'), pallets:num('ePallets'), exception_type:$('eExc').value||null, note:$('eNote').value.trim()||null};
    $('eSave').disabled=true;
    const { data, error } = await sbA.from('pickups').update(patch).eq('id',id).select('id');
    $('eSave').disabled=false;
    if(error) return $('eErr').textContent='保存失败：'+(error.code==='23505'?'与已有记录重复':error.message);
    if(!data||!data.length) return $('eErr').textContent='保存失败：没有修改权限';
    amodalClose(); loadHistory(); };
}
function adminDelete(id){
  const r=(S.hRows||[]).find(x=>x.id===id); if(!r) return;
  amodal(`<h3 style="margin:2px 0 4px">删除这条记录？</h3><div style="font-size:13px;color:var(--ink2);margin-top:6px">${esc(r.carrier)} · Trailer <b>${esc(r.trailer_no)}</b> · 填报人 ${esc(r.reporter)}<br>记录和照片会被<b style="color:var(--bad)">永久删除，无法恢复</b>。</div>
    <div class="e" id="vErr"></div><button class="btn2 dark" id="vGo">确认删除</button><button class="btn2" id="vCancel">取消</button>`);
  $('vCancel').onclick=amodalClose;
  $('vGo').onclick=async()=>{
    $('vGo').disabled=true;
    const { data, error } = await sbA.from('pickups').delete().eq('id',id).select('id,photo_paths');
    $('vGo').disabled=false;
    if(error) return $('vErr').textContent='删除失败：'+error.message;
    if(!data||!data.length) return $('vErr').textContent='删除失败：没有删除权限';
    const paths=data[0].photo_paths||[]; if(paths.length) await sbA.storage.from('pickup-photos').remove(paths);
    amodalClose(); loadHistory(); };
}
document.addEventListener('click', async e=>{
  if(e.target.id==='aLogin') return adminLogin();
  if(e.target.id==='aLogout'){ await sbA.auth.signOut(); S.admin=false; renderAdminBar(); return loadHistory(); }
  if(e.target===$('amodal')) return amodalClose();
  const a=e.target.closest('[data-aedit]'); if(a) return adminEdit(a.dataset.aedit);
  const d=e.target.closest('[data-adel]'); if(d) return adminDelete(d.dataset.adel);
});
function setTab(tab){
  S.tab=tab;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const isForm=tab==='form';
  $('historyView').style.display=isForm?'none':'';
  $('doneView').style.display='none';
  $('formView').style.display=isForm?'':'none';
  $('submitBar').style.display=isForm?'':'none';
  if(!isForm){ renderHDate(); checkAdmin().finally(loadHistory); }
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ setTab(tb.dataset.tab); return; }
  const hc=e.target.closest('[data-hc]'); if(hc){ S.hCarrier=hc.dataset.hc; renderHDate(); renderHistory(); return; }
});
$('hDate').onchange=loadHistory;
$('hRefresh').onclick=loadHistory;
$('hQ').oninput=renderHistory;

async function boot(){
  if(params.get('from')==='dash'){ $('backDash').style.display=''; if(CFG.DASHBOARD_URL) $('backDash').href=CFG.DASHBOARD_URL; }
  if(LIVE){
    const [w,c]=await Promise.all([sb.from('warehouses').select('code,name,alias,region,tz').order('code'), sb.from('carriers').select('code,unit')]);
    if(!w.error && w.data.length) S.warehouses=w.data;
    if(!c.error && c.data.length){ const order=['USPS','UPS','FedEx Ground','FedEx Express','DHL','GOFO','UNIUNI','Speedx']; S.carriers=c.data.sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)); }
  } else { $('demoNote').style.display=''; }
  renderWh();
  $('arrived').value=localInputValue(new Date());
  $('reporter').value=store.get('reporter','');
  applyLang();
}
['orders','pallets'].forEach(id=>$(id).addEventListener('input',qtyHint));
boot();
</script>
</body>
</html>
