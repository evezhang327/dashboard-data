<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#E1251B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>提货车辆登记 · Pickup Check-in</title>
<script src="config.js" onerror="void 0"></script>
<script src="supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>')</script>
<style>
:root{--red:#E1251B;--bg:#f5f5f6;--card:#fff;--line:#e3e5ea;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--blue:#2a78d6;--good:#0a7a0a;--good-bg:#e9f7e9;--bad:#c62f2f;--bad-bg:#fbeaea;--warn-bg:#fdf4e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#E1251B,#C81623);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:18px;margin:0;line-height:1.25}
.top small{display:block;opacity:.7;font-size:12px;font-weight:400}
.lang{display:flex;border:1px solid #ffffff44;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 10px;font-size:13px;opacity:.6}
.lang button.on{background:#fff;color:#C81623;opacity:1}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:0;box-shadow:0 1px 2px #0000000d,0 1px 8px #0000000a;border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.lbl .req{color:var(--bad);margin-left:2px}
.lbl small{font-weight:400;color:var(--ink3);font-size:12px}
select,input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e1251b40;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;text-align:center;font-weight:600;font-size:15px;cursor:pointer}
.opt small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.opt.on{border-color:var(--red);background:var(--red);color:#fff}
.opt.on small{color:#ffd9d6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trailer{text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:20px!important}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f1f3f6}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:#0f172acc;color:#fff;font-size:14px;line-height:24px;padding:0}
.add{width:84px;height:84px;border:1.5px dashed #b8bfca;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;cursor:pointer;background:#fff}
.add b{font-size:26px;line-height:1;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;background:#fff;cursor:pointer}
.chip.on{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.chip.none.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.submit{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.submit button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:17px;font-weight:700}
.submit button:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.note{font-size:13px;color:var(--ink2);background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.today{font-size:13px;color:var(--ink2)}
.today .t{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.today .t:last-child{border:0}
.today b{color:var(--ink)}
.done{text-align:center;padding:30px 16px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);font-size:34px;line-height:64px;margin:0 auto 10px}
.done h2{margin:0 0 6px}
.done .sum{text-align:left;background:#f8f9fb;border-radius:10px;padding:10px 12px;margin:14px 0;font-size:14px}
.btn2{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;margin-top:8px}
.btn2.dark{background:var(--red);color:#fff;border-color:var(--red)}
.tabs{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 14px 0;display:flex;justify-content:center}
.tabs div{display:flex;background:#e6e8ec;border-radius:12px;padding:3px;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--red);box-shadow:0 1px 2px #0f172a1a}
.hrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hrow select,.hrow input{flex:1;padding:10px;font-size:15px}
body.dropf .ndrop{display:none!important}
.drop-only{display:none}body.dropf .drop-only{display:block}
.unitsw{display:flex;gap:6px;margin-top:8px}.unitsw button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-weight:600}.unitsw button.on{border-color:var(--red);color:var(--red);background:#fdeceb}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}.flow b{background:#f1f3f6;border-radius:7px;padding:3px 8px;color:var(--ink)}
.remind{background:#fff4e5;border:1px solid #f5cf94;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:#6b3d00}.remind ul{margin:6px 0;padding-left:18px;font-size:13px}
.task{border-left:4px solid #d98a00}.task.wait{border-left-color:#1f8a4c}.task.done{border-left-color:#94a3b8}
.task .th{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.task .tr{font-weight:700;font-size:18px;letter-spacing:.5px}.task .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px;font-size:12px;color:var(--ink3)}.steps div{display:flex;flex-direction:column;gap:2px}.steps i{height:4px;border-radius:2px;background:#e3e5ea}.steps .ok{color:var(--ink2)}.steps .ok i{background:#1f8a4c}.steps .cur{color:var(--ink);font-weight:600}.steps .cur i{background:#d98a00}.steps time{font-variant-numeric:tabular-nums}
.eta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:10px}.late{color:var(--bad);font-weight:600}
.dchip{white-space:nowrap;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:#fff1d6;color:#8a5600}.dchip.wait{background:#e5f5ec;color:#1f8a4c}.dchip.late{background:var(--bad-bg);color:var(--bad)}.dchip.done{background:#eef1f5;color:var(--ink2)}
.dbtn{display:block;width:100%;padding:12px;border:0;border-radius:11px;color:#fff;font-weight:700;font-size:15px}.dbtn.amber{background:#d98a00}.dbtn.green{background:#1f8a4c}
.cf{background:#f8f9fb;border-radius:10px;padding:10px 12px;margin:10px 0}.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;align-items:baseline}.kv span{color:var(--ink2);font-size:13px}
.badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}.badge.hot{background:#e8a317}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#0f172ae6;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw}.toast.show{opacity:1;transform:translateX(-50%)}

body:not(.admf) .admf-only,body:not(.admf) .admf-inl{display:none!important}
body.admf .nadm{display:none!important}
.admf-only,.admf-inl{display:none}body.admf .admf-only{display:flex}body.admf .admf-inl{display:inline}
.adm{font-size:12px;background:#fff4e5;color:#8a4b00;border-radius:8px;padding:8px 10px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.adm a,.adm button{color:var(--red);background:none;border:0;padding:0;font-size:12px;text-decoration:underline;cursor:pointer}
.ract{display:flex;gap:8px;margin-top:8px}
.ract button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.ract button.r{color:var(--red);border-color:#f3c3c0}
.amodal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:flex-end;justify-content:center;z-index:60}
.amodal.on{display:flex}
.amodal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.amodal label{display:block;font-size:12px;color:var(--ink2);margin-top:8px}
.amodal input,.amodal select{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.amodal .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amodal .e{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ro{font-size:12px;color:var(--ink2);background:#eef2f7;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.hsum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:4px 0 10px}
.hsum b{color:var(--ink);font-size:16px}
.rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.rec .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .tr{font-weight:700;font-size:17px;letter-spacing:.5px}
.rec .m{font-size:13px;color:var(--ink2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--ink2)}
.pill.c{background:#fdeceb;color:#C81623}
.pill.x{background:var(--bad-bg);color:var(--bad)}
.rec.void{opacity:.55}
.rec.void .tr{text-decoration:line-through}
.hchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.hchips .chip{white-space:nowrap;font-size:13px;padding:5px 11px}
.hchips .chip.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:600}
.overlay.on{display:flex}
</style>
</head>

<main id="formView">
  <div class="adm admf-only" id="fAdmin"></div>
  <div id="dropRemind"></div>
  <div class="note" id="demoNote" style="display:none" data-t="demo"></div>

  <div class="card">
    <div class="lbl"><span><span data-t="wh"></span><span class="req">*</span></span></div>
    <select id="wh"></select>
  </div>

  <div class="card">
    <div class="lbl"><span><span data-t="carrier"></span><span class="req">*</span></span></div>
    <div class="grid" id="carriers"></div>
  </div>

  <div class="card drop-only" id="dropFlow"></div>

  <div class="card nadm">
    <div class="lbl"><span><span data-t="trailer"></span><span class="req">*</span></span><small data-t="trailerHint"></small></div>
    <input type="text" id="trailer" class="trailer" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="e.g. 53A1234">
  </div>

  <div class="card drop-only">
    <div class="lbl"><span><span id="dockLbl">Dock</span><span class="req">*</span></span></div>
    <input type="text" id="dock" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="e.g. 12">
  </div>
  <div class="card drop-only">
    <div class="lbl"><span id="estLbl"></span><small id="estHint"></small></div>
    <input type="number" id="estQty" inputmode="numeric" min="0" step="1" placeholder="0">
    <div class="unitsw"><button type="button" data-eu="板" class="on" id="euP"></button><button type="button" data-eu="单" id="euO"></button></div>
  </div>

  <div class="card">
    <div class="lbl"><span><span id="arrLbl"></span><span class="req">*</span></span><button type="button" class="chip" id="nowBtn" style="padding:3px 10px;font-size:12px" data-t="now"></button></div>
    <input type="datetime-local" id="arrived">
  </div>

  <div class="card nadm ndrop">
    <div class="row">
      <div><div class="lbl"><span><span data-t="orders"></span><span class="req qreq">*</span></span><small class="qhint" data-t="either"></small></div><input type="number" id="orders" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      <div><div class="lbl"><span><span data-t="pallets"></span><span class="req qreq">*</span></span><small class="qhint" data-t="either"></small></div><input type="number" id="pallets" inputmode="numeric" min="0" step="1" placeholder="0"></div>
    </div>
  </div>

  <div class="card nadm ndrop">
    <div class="lbl"><span><span data-t="photos"></span><span class="req">*</span></span><small data-t="photoHint"></small></div>
    <div class="photos" id="photos"></div>
    <input type="file" id="file" accept="image/*" capture="environment" multiple style="display:none">
  </div>

  <div class="card ndrop">
    <div class="lbl"><span><span data-t="exception"></span><span class="req admf-inl">*</span></span></div>
    <div class="chips" id="exc"></div>
    <textarea id="note" maxlength="500" style="margin-top:10px;display:none"></textarea>
  </div>

  <div class="card nadm">
    <div class="lbl"><span><span data-t="reporter"></span><span class="req">*</span></span></div>
    <input type="text" id="reporter" maxlength="40" autocomplete="name">
  </div>

  <div class="card today" id="todayBox" style="display:none"></div>
  <div class="err" id="err"></div>
</main>

<main id="doneView" style="display:none"></main>

<main id="tasksView" style="display:none"></main>

<main id="historyView" style="display:none">
  <div class="ro" data-t="readonly" id="hRo"></div>
  <div id="hAdmin"></div>
  <div class="hrow"><select id="hDate"></select><button class="chip" id="hRefresh" style="flex:none" data-t="refresh"></button></div>
  <div class="hchips" id="hCarrier"></div>
  <div class="hrow"><input type="text" id="hQ" autocomplete="off" spellcheck="false"></div>
  <div class="hsum" id="hSum"></div>

// 照片压缩：长边 1600px，JPEG 0.75
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1600; let {width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error('compress')); },'image/jpeg',0.75); };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2));
const clientId = store.get('cid','') || (()=>{ const v=uuid(); store.set('cid',v); return v; })();

function validate(){
  const w=whObj(); const unit=(S.carriers.find(c=>c.code===S.carrier)||{}).unit;
  if(!w) return 'e_wh'; if(!S.carrier) return 'e_carrier';
  if(isDropSel() && !S.admin) return null;
  if(S.admin){ if(!$('arrived').value) return 'e_arrived'; if(!S.exc) return 'e_exc'; if(!$('note').value.trim()) return 'e_note_adm'; return null; }
  if(!$('trailer').value.trim()) return 'e_trailer'; if(!$('arrived').value) return 'e_arrived';
  if($('orders').value!=='' && +$('orders').value<0) return 'e_orders';
  if($('orders').value==='' && $('pallets').value==='') return 'e_pallets_req';
  if(+$('pallets').value<0) return 'e_pallets';
  if(!S.photos.length) return 'e_photo'; if(S.exc==='其他' && !$('note').value.trim()) return 'e_note';
  if(!$('reporter').value.trim()) return 'e_reporter';
  return null;
}
function overlay(txt){ $('overlay').classList.toggle('on',!!txt); $('overlayText').textContent=txt||''; }

async function submit(){
  $('err').textContent='';
  const v=validate(); if(v){ $('err').textContent=t(v); $('err').scrollIntoView({block:'center',behavior:'smooth'}); return; }
  const w=whObj();
  if(S.admin) return submitAdmin(w);
  if(isDropSel()) return submitDrop(w);
  const trailer=$('trailer').value.trim().toUpperCase().replace(/\s+/g,'');
  // 同日同 trailer 已登记：二次确认
  if(S.today && !S.dupConfirm){ const hit=(S.today.rows||[]).find(r=>r.carrier===baseOf(S.carrier)&&(r.trailers||[]).some(x=>x.toUpperCase()===trailer)); if(hit){ S.dupConfirm=true; $('err').textContent=t('confirmDup'); return; } }
  const arrived=new Date($('arrived').value);
  const day=localDateIn(w.tz, arrived);
  const row={ date:day, warehouse:w.code, carrier:baseOf(S.carrier), trailer_no:trailer, arrived_at:arrived.toISOString(),
    orders: $('orders').value===''?null:+$('orders').value, pallets: $('pallets').value===''?null:+$('pallets').value,
    exception_type: S.exc||null, note: S.exc ? ($('note').value.trim()||null) : null,
    reporter: $('reporter').value.trim(), photo_paths:[], client_id: clientId };
  store.set('wh',w.code); store.set('reporter',row.reporter);
  $('submit').disabled=true;
  try{
    if(LIVE){
      overlay(t('uploading'));
      for(const p of S.photos){
        const path=`${w.code}/${day}/${row.carrier}_${trailer}_${uuid().slice(0,8)}.jpg`;
        const { error } = await sb.storage.from('pickup-photos').upload(path, p.blob, {contentType:'image/jpeg', upsert:false});
        if(error) throw error; row.photo_paths.push(path);
      }
      overlay(t('saving'));
      const { error } = await sb.from('pickups').insert(row);
      if(error){ if(error.code==='23505') throw new Error(t('dup')); throw error; }
    } else { await new Promise(r=>setTimeout(r,500)); S.demoRows.unshift({...row, id:uuid(), photo_count:S.photos.length, voided:false, created_at:new Date().toISOString()}); }
    overlay(''); showDone(row, w);
  }catch(err){ overlay(''); $('err').textContent = t('fail') + (err.message||err); }
  finally{ $('submit').disabled=false; }
}
// 管理员报备：只登记异常，不算车（kind='admin'），无照片/Trailer/单量
async function submitAdmin(w){
  const arrived=new Date($('arrived').value); const day=localDateIn(w.tz, arrived);
  const row={ date:day, warehouse:w.code, carrier:baseOf(S.carrier), sub_carrier:carrierInfo(S.carrier).sub||null, trailer_no:'ADMIN-'+uuid().replace(/-/g,'').slice(0,8).toUpperCase(), arrived_at:arrived.toISOString(),
    orders:null, pallets:null, exception_type:S.exc, note:$('note').value.trim(), reporter:(S.adminEmail||'admin').split('@')[0],
    photo_paths:[], client_id:clientId, kind:'admin' };
  store.set('wh',w.code); $('submit').disabled=true;
  try{ overlay(t('saving'));
    const { error } = await sbA.from('pickups').insert(row); if(error) throw error;
    overlay(''); showDone(row, w);
  }catch(err){ overlay(''); $('err').textContent = t('fail') + (err.message||err); }
  finally{ $('submit').disabled=false; }
}
function showDone(row, w){
  $('formView').style.display='none'; $('submitBar').style.display='none';

  $('doneView').style.display='';
  $('doneView').innerHTML = `<div class="card done"><div class="ok">✓</div><h2>${t('okTitle')}</h2>${LIVE?'':`<div class="note">${t('demo')}</div>`}
    ${row.kind==='admin'?`<div class="sum"><div><b>${esc(w.code)}</b> · ${esc(row.carrier)} · 管理员报备（不计车）</div><div>${t('arrived')}: ${d.toLocaleString('zh-CN',{hour12:false})}</div><div>异常：${esc(row.exception_type)}</div><div>备注：${esc(row.note)}</div></div>`:''}<div class="sum" ${row.kind==='admin'?'style="display:none"':''}><div><b>${esc(w.code)}</b> · ${esc(row.carrier)}</div><div>Trailer: <b>${esc(row.trailer_no)}</b></div><div>${t('arrived')}: ${d.toLocaleString(lang==='zh'?'zh-CN':'en-US',{hour12:false})}</div><div>${t('orders')}: ${row.orders??'—'}${row.pallets!=null?` · ${t('pallets')}: ${row.pallets}`:''}</div>${row.exception_type?`<div style="color:var(--bad)">${t('exception')}: ${esc(row.exception_type)}</div>`:''}<div>${t('photos')}: ${S.photos.length}</div></div>
    <div class="note" style="margin-top:10px;text-align:left">${t('fixNote')}</div><button class="btn2 dark" id="againBtn">${t('again')}</button></div>`;
  $('againBtn').onclick=resetForm;
}
function resetForm(){
  S.photos.forEach(p=>URL.revokeObjectURL(p.url)); S.photos=[]; S.exc=''; S.dupConfirm=false;

document.addEventListener('click', e=>{
  const c=e.target.closest('[data-carrier]'); if(c){ S.carrier=c.dataset.carrier; S.dupConfirm=false; renderCarriers(); return; }

const PEAK=['2026-11-20','2026-12-04'];
function addDays(d,n){ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function renderHDate(){
  const w=whObj(); const today=localDateIn(w&&w.tz, new Date()); const cur=$('hDate').value;
  const opts=[[today+'|'+today,t('hToday')],[addDays(today,-1)+'|'+addDays(today,-1),t('hYesterday')],[PEAK[0]+'|'+PEAK[1],t('hAll')]];
  for(let d=PEAK[1]; d>=PEAK[0]; d=addDays(d,-1)){ if(d<=today && d!==today && d!==addDays(today,-1)) opts.push([d+'|'+d, d.slice(5).replace('-','/')]); }
  $('hDate').innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(cur && opts.some(o=>o[0]===cur)) $('hDate').value=cur;
  $('hCarrier').innerHTML=[['',t('hAllCarrier')],...S.carriers.map(c=>[c.code,c.code])].map(([v,l])=>`<span class="chip ${S.hCarrier===v?'on':''}" data-hc="${esc(v)}">${esc(l)}</span>`).join('');
}
async function loadHistory(){
  const w=whObj();
  if(!w){ S.hRows=null; return renderHistory(); }
  const [from,to]=$('hDate').value.split('|');
  if(!LIVE){ S.hRows=S.demoRows.filter(r=>r.warehouse===w.code&&r.date>=from&&r.date<=to); return renderHistory(); }
  $('hList').innerHTML=`<div class="empty" style="text-align:center;color:var(--ink3);padding:20px">${t('hLoading')}</div>`;
  const { data, error } = S.admin
    ? await sbA.from('pickups').select('id,date,arrived_at,carrier,trailer_no,orders,pallets,exception_type,note,reporter,photo_paths,voided,void_reason,created_at,kind,sub_carrier,dock,drop_status,loaded_at,picked_at,est_qty,est_unit').eq('warehouse',w.code).gte('date',from).lte('date',to).order('arrived_at',{ascending:false}).limit(1000)

const EXC_TYPES=['','晚到','车满/部分拒收','货未齐','车辆问题','其他'];
function tzOffsetMs(tz, d){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime();
}
function toTzInput(iso, tz){ const d=new Date(iso); return new Date(d.getTime()+tzOffsetMs(tz,d)).toISOString().slice(0,16); }
function fromTzInput(v, tz){ const [a,b]=v.split('T'); const [y,m,dd]=a.split('-').map(Number); const [hh,mi]=b.split(':').map(Number);
  const g=Date.UTC(y,m-1,dd,hh,mi); let x=g-tzOffsetMs(tz,new Date(g)); x=g-tzOffsetMs(tz,new Date(x)); return new Date(x); }

const DROP_WH='ONT-LG-5-US', DROP_BASE='FedEx Ground', DROP_SUBS=['NC','C','Mixed'], LOAD_MIN=40, WAIT_WARN=120;
const L=(zh,en)=>lang==='zh'?zh:en;
function carriersFor(code){

    .concat(S.carriers.filter(c=>c.code!=='FedEx Ground'&&c.code!=='FedEx Express'));
}
function carrierInfo(code){ const w=whObj(); return carriersFor(w&&w.code).find(c=>c.code===code) || {code, base:code}; }
const baseOf=code=>carrierInfo(code).base||code;
const isDropSel=()=>{ const w=whObj(); return !!(w&&w.code===DROP_WH&&carrierInfo(S.carrier).drop); };
const dispCarrier=r=>r.sub_carrier?('FedEx '+r.sub_carrier):r.carrier;

  if(!lax5 && S.tab==='tasks') setTab('form');

}
const tzOf=()=>{ const w=whObj(); return (w&&w.tz)||'America/Los_Angeles'; };
const hm=ts=>new Intl.DateTimeFormat('en-GB',{timeZone:tzOf(),hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts));
const md2=ts=>new Intl.DateTimeFormat('en-US',{timeZone:tzOf(),month:'numeric',day:'numeric'}).format(new Date(ts));
const dState=r=>r.drop_status==='picked'?'done':r.drop_status==='ready'?'wait':'load';
const etaOf=r=>new Date(r.arrived_at).getTime()+LOAD_MIN*60000;
const waitMin=r=>dState(r)==='wait'&&r.loaded_at?Math.round((Date.now()-new Date(r.loaded_at))/60000):0;
const isLate=r=>dState(r)==='load'&&Date.now()>etaOf(r);
const isStale=r=>waitMin(r)>WAIT_WARN;
function dChip(r){ const s=dState(r);
  if(s==='done') return `<span class="dchip done">${L('已提 · 闭环','Picked up · closed')}</span>`;
  if(s==='wait') return `<span class="dchip ${isStale(r)?'late':'wait'}">${isStale(r)?L('待提超 2 小时','Waiting > 2h'):L('待提货','Awaiting pickup')} · Dock ${esc(r.dock)}</span>`;
  return `<span class="dchip ${isLate(r)?'late':'load'}">${isLate(r)?L('装载超时','Loading overdue'):L('装载中','Loading')}</span>`; }
function dSteps(r){ const s=dState(r); const cell=(n,ts,c)=>`<div class="${c}"><i></i>${n}<time>${ts?hm(ts):'—'}</time></div>`;
  return `<div class="steps">${cell(L('装载中','Loading'),r.arrived_at,s==='load'?'cur':'ok')}${cell(L('待提货','Awaiting'),r.loaded_at,s==='wait'?'cur':s==='done'?'ok':'')}${cell(L('已提','Picked'),r.picked_at,s==='done'?'ok':'')}</div>`; }
function dEta(r){ const s=dState(r);
  if(s==='done') return `<div class="eta">${L('用时','Took')} <b>${Math.round((new Date(r.picked_at)-new Date(r.arrived_at))/60000)} ${L('分钟','min')}</b></div>`;
  if(s==='wait') return `<div class="eta"><span>${L('已装完','Loaded')} <b>${waitMin(r)} ${L('分钟','min')}</b>${L('，等待司机提走',' ago, waiting for pickup')}</span>${isStale(r)?`<span class="late">${L('柜子还在吗？拉走了请点「确认已提」','Still here? If it left, tap "Confirm picked up"')}</span>`:''}</div>`;
  const left=Math.round((etaOf(r)-Date.now())/60000);
  return `<div class="eta">${L('预计装完','ETA')} <b>${hm(etaOf(r))}</b><span class="${left<0?'late':''}">${left<0?L(`已超时 ${-left} 分钟`,`${-left} min overdue`):L(`还剩 ${left} 分钟`,`${left} min left`)}</span></div>`; }

      ${s==='wait'?`<button class="btn2 dark" id="dkPicked" style="background:#1f8a4c;border-color:#1f8a4c">${L(`${esc(busy.trailer_no)} 已提走，闭环后开始新任务`,`${esc(busy.trailer_no)} has left — close it and start`)}</button>`:''}
      <button class="btn2" id="dkBack">${L('还没走，换个 Dock','Not yet — use another dock')}</button>`);
    $('dkBack').onclick=()=>{ amodalClose(); $('dock').focus(); };
    if($('dkPicked')) $('dkPicked').onclick=async()=>{ const r=await sb.rpc('drop_mark_picked',{p_id:busy.id}); if(r.error||!['ok','already'].includes(r.data)){ toast(L('操作失败：','Failed: ')+(r.error?r.error.message:r.data)); return; } amodalClose(); S.dockOk=true; try{ await submitDrop(w); } finally{ S.dockOk=false; } };
    return;
  }
  if(S.today && !S.dupConfirm){ const hit=(S.today.rows||[]).find(r=>r.carrier===DROP_BASE&&(r.trailers||[]).some(x=>x.toUpperCase()===trailer)); if(hit){ S.dupConfirm=true; $('err').textContent=t('confirmDup'); return; } }
  const start=new Date($('arrived').value), day=localDateIn(w.tz,start), info=carrierInfo(S.carrier), q=$('estQty').value;
  const row={ date:day, warehouse:w.code, carrier:DROP_BASE, sub_carrier:info.sub, trailer_no:trailer, dock, drop_status:'loading', arrived_at:start.toISOString(),
    est_qty:q===''?null:Math.max(0,Math.round(+q)), est_unit:S.estUnit||'板', orders:null, pallets:null, exception_type:null, note:null,
    reporter:$('reporter').value.trim(), photo_paths:[], client_id:clientId };
  store.set('wh',w.code); store.set('reporter',row.reporter); $('submit').disabled=true;
  try{ overlay(t('saving'));
    const { error } = await sb.from('pickups').insert(row); if(error) throw error;
    overlay(''); $('trailer').value=''; $('dock').value=''; $('estQty').value=''; S.dupConfirm=false;
    toast(L(`任务已开始，预计 ${hm(start.getTime()+LOAD_MIN*60000)} 装完`,`Task started, ETA ${hm(start.getTime()+LOAD_MIN*60000)}`));
    renderToday(); setTab('tasks');
  }catch(err){ overlay(''); $('err').textContent=t('fail')+(err.message||err); }
  finally{ $('submit').disabled=false; }
}
// 完成装货：复查 Trailer / 服务商 / Dock + 实际数量 + 照片（必填）
function openLoad(id){
  const r=(S.drops||[]).concat(S.hRows||[]).find(x=>x.id===id); if(!r) return;
  const ph=[];
  amodal(`<h3 style="margin:2px 0 4px">${L('完成装货前请复查','Check before marking loaded')}</h3><div style="font-size:12px;color:var(--ink2)">${L(`核对无误后再确认，确认后变成「待提货 · Dock ${esc(r.dock)}」`,`After confirming it becomes "Awaiting pickup · Dock ${esc(r.dock)}"`)}</div>
    <div class="cf"><div class="kv"><span>Trailer</span><b class="trailer" style="font-size:18px">${esc(r.trailer_no)}</b><span>${t('carrier')}</span><b>${esc(dispCarrier(r))}</b><span>Dock</span><b>${esc(r.dock)}</b></div></div>
    <label>${L('实际装车数量','Actual quantity loaded')}（${L('预计','est.')} ${r.est_qty==null?'—':r.est_qty+' '+(r.est_unit||'板')}）</label>
    <div class="g2"><input id="lQty" type="number" min="0" step="1" inputmode="numeric" value="${r.est_qty??''}"><select id="lUnit"><option value="板" ${r.est_unit!=='单'?'selected':''}>${L('板','Pallets')}</option><option value="单" ${r.est_unit==='单'?'selected':''}>${L('单','Orders')}</option></select></div>
    <label>${L('装车照片（必填，至少 1 张：车厢内货物、Trailer 号）','Loading photos (required: cargo inside, trailer no.)')}</label>
    <div class="photos" id="lPhs" style="margin-top:6px"></div><input type="file" id="lFile" accept="image/*" capture="environment" multiple style="display:none">
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:12px"><input type="checkbox" id="lOk" style="width:auto;margin:0">${L('我已核对 Trailer 号、服务商和数量','I have checked trailer, carrier and quantity')}</label>
    <div class="e" id="lErr"></div><button class="btn2 dark" id="lGo" style="background:#d98a00;border-color:#d98a00">${L('确认完成装货','Confirm loaded')}</button><button class="btn2" id="lCancel">${L('返回','Back')}</button>`);
  const draw=()=>{ $('lPhs').innerHTML=ph.map((p,i)=>`<div class="ph"><img src="${p.url}" alt=""><button data-ldel="${i}">×</button></div>`).join('')+(ph.length<6?`<div class="add" id="lAdd"><b>＋</b>${t('addPhoto')}</div>`:''); };
  draw();
  $('lPhs').onclick=e=>{ const d=e.target.closest('[data-ldel]'); if(d){ ph.splice(+d.dataset.ldel,1); draw(); return; } if(e.target.closest('#lAdd')) $('lFile').click(); };
  $('lFile').onchange=async e=>{ const fs=[...e.target.files].slice(0,6-ph.length); e.target.value=''; for(const f of fs){ const b=await compress(f); ph.push({blob:b,url:URL.createObjectURL(b)}); } draw(); };
  $('lCancel').onclick=amodalClose;
  $('lGo').onclick=async()=>{
    const q=$('lQty').value; $('lErr').textContent='';
    if(q===''||+q<0) return $('lErr').textContent=L('请填写实际数量','Enter the actual quantity');
    if($('lUnit').value==='板' && +q>200) return $('lErr').textContent=L('板数不能超过 200','Pallets cannot exceed 200');
    if(!ph.length) return $('lErr').textContent=L('请至少拍 1 张照片','Add at least 1 photo');
    if(!$('lOk').checked) return $('lErr').textContent=L('请勾选已核对','Please tick the check box');
    $('lGo').disabled=true;
    try{ const w=whObj(); const paths=[];
      for(const p of ph){ const path=`${w.code}/${r.date}/FedEx-${r.sub_carrier||'G'}_${r.trailer_no}_${uuid().slice(0,8)}.jpg`;
        const { error } = await sb.storage.from('pickup-photos').upload(path,p.blob,{contentType:'image/jpeg',upsert:false}); if(error) throw error; paths.push(path); }
      const res=await sb.rpc('drop_mark_loaded',{p_id:r.id,p_qty:Math.round(+q),p_unit:$('lUnit').value,p_photos:paths});
      if(res.error) throw res.error; if(res.data!=='ok') throw new Error(res.data==='already'?L('这个任务已经完成装货了','Already marked loaded'):res.data);
      amodalClose(); toast(L(`${r.trailer_no} 已装完，待提货 · Dock ${r.dock}`,`${r.trailer_no} loaded, awaiting pickup · Dock ${r.dock}`));
      await loadDrops(); if(S.tab==='history') loadHistory();
    }catch(err){ $('lErr').textContent=t('fail')+(err.message||err); }
    finally{ if($('lGo')) $('lGo').disabled=false; }
  };
}
function openPick(id){
  const r=(S.drops||[]).concat(S.hRows||[]).find(x=>x.id===id); if(!r) return;
  amodal(`<h3 style="margin:2px 0 6px">${L('确认这个柜子已经被拉走？','Confirm this trailer has been picked up?')}</h3>
    <div class="cf"><div class="kv"><span>Trailer</span><b class="trailer" style="font-size:18px">${esc(r.trailer_no)}</b><span>${t('carrier')}</span><b>${esc(dispCarrier(r))}</b><span>Dock</span><b>${esc(r.dock)}</b></div></div>
    <div class="e" id="pErr"></div><button class="btn2 dark" id="pGo" style="background:#1f8a4c;border-color:#1f8a4c">${L('确认已提 · 任务闭环','Confirm picked up · close')}</button><button class="btn2" id="pCancel">${L('返回','Back')}</button>`);
  $('pCancel').onclick=amodalClose;
  $('pGo').onclick=async()=>{ $('pGo').disabled=true;
    const res=await sb.rpc('drop_mark_picked',{p_id:r.id});
    if(res.error||!['ok','already'].includes(res.data)){ $('pErr').textContent=t('fail')+(res.error?res.error.message:res.data); $('pGo').disabled=false; return; }
    amodalClose(); toast(L(`${r.trailer_no} 已提走，任务闭环`,`${r.trailer_no} picked up, task closed`)); await loadDrops(); if(S.tab==='history') loadHistory(); };
}
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-dload]'); if(a) return openLoad(a.dataset.dload);
  const p=e.target.closest('[data-dpick]'); if(p) return openPick(p.dataset.dpick);
  if(e.target.id==='goTasks') return setTab('tasks');
  if(e.target.id==='dRefresh') return loadDrops();
  const u=e.target.closest('[data-eu]'); if(u){ S.estUnit=u.dataset.eu; document.querySelectorAll('[data-eu]').forEach(x=>x.classList.toggle('on',x===u)); }
});
setInterval(()=>{ renderDrops(); renderDropRemind(); }, 30000);
setInterval(()=>{ if(!document.hidden) loadDrops(); }, 90000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadDrops(); });
function dHist(r){
  return `<div class="m"><span>Dock ${esc(r.dock)}</span><span>${L('开始','Start')} ${hm(r.arrived_at)}</span><span>${L('装完','Loaded')} ${r.loaded_at?hm(r.loaded_at):'—'}</span><span>${L('已提','Picked')} ${r.picked_at?hm(r.picked_at):'—'}</span>${r.est_qty!=null?`<span>${L('预计','est.')} ${r.est_qty} ${esc(r.est_unit||'')}</span>`:''}</div>${r.drop_status!=='picked'?`<div style="margin-top:8px">${dAct(r)}</div>`:''}`;
}
function dropLang(){
  $('estLbl').textContent=L('预计货量','Estimated volume'); $('estHint').textContent=L('选填','optional');
  $('euP').textContent=L('板','Pallets'); $('euO').textContent=L('单','Orders'); $('dockLbl').textContent=L('Dock 口','Dock');
  $('dropFlow').innerHTML=`<div class="flow"><b>① ${L('装载中','Loading')}</b>→<b>② ${L('待提货','Awaiting pickup')}</b>→<b>③ ${L('已提（闭环）','Picked up (closed)')}</b></div><div style="font-size:12px;color:var(--ink2);margin-top:8px">${L(`提交即开始装载任务，预计 ${LOAD_MIN} 分钟装完。完成装货、确认已提在「提货任务跟进」里操作。`,`Submitting starts a loading task (ETA ${LOAD_MIN} min). Mark loaded / picked up under "Pickup tasks".`)}</div>`;
  applyMode(); renderDrops(); renderDropRemind();
}

boot();
</script>
</body>
</html>
